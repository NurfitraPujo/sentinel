name: Release Huawei Staging

# Staging release: push tag v*-staging (e.g. v0.1.0-staging), or dispatch this
# workflow manually with an explicit version_tag.
# Builds all 7 first-party images and pushes each ONE build to BOTH registries:
# Huawei SWR (rollback origin, still live) and AWS ECR (migration target).
# Then ArgoCD-syncs the EKS app (sentinel-tuju-staging) FIRST, and the CCE app
# (sentinel-staging) after it, with per-service image.tag parameters.
# Mirrors cdc-pipeline's release-staging.yml (inline build-push; Sentinel has no
# private Go modules, so no host-binary Dockerfile.swr dance is needed).
#
# The `name:` and the filename are intentionally NOT renamed: both are load-bearing
# (branch-protection required checks bind the workflow `name:`, and
# workflow/registry/repos.toml:637 references the release-huawei-* paths).

on:
  push:
    tags: ["v*-staging"]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to build and deploy to staging (e.g., v0.2.40-staging)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # Required for AWS OIDC (ECR push + ArgoCD SSM credentials)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-helm-huawei:
    name: Lint Huawei Helm manifests
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","tuju-ai-runner"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.14.0

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.26"
          cache: false

      - name: Install kube-linter
        run: |
          go install golang.stackrox.io/kube-linter/cmd/kube-linter@v0.6.5
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: helm lint
        run: helm lint deploy/helm/sentinel

      - name: Lint Helm manifests
        run: |
          set -euo pipefail
          timestamp=$(date +%s)
          mkdir -p tmp

          generateManifests() {
            helm template sentinel ./deploy/helm/sentinel --values ./deploy/helm/sentinel/"$1" > ./tmp/"$1-$timestamp.yaml"
          }

          for manifest in values-huawei-production.yml values-huawei-staging.yml values.aws.production.yml values.aws.staging.yml; do
            generateManifests "$manifest"
            echo "Linting $manifest ..."
            kube-linter lint --config ./deploy/helm/sentinel/.kube-linter.yaml "./tmp/$manifest-$timestamp.yaml"
          done

  build-images:
    name: Build & Push images to SWR + ECR
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","tuju-ai-runner"]') }}
    timeout-minutes: 30
    needs: [lint-helm-huawei]
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC (ECR push)
    strategy:
      # A single image build failing must not cancel the others. The buildkit daemon on the
      # self-hosted runners dies mid-build under load ("received prior goaway ... graceful_stop"):
      # six occurrences on 2026-09-08/09, and each one took every sibling image down with it —
      # on PR #16 one processor failure cancelled all six images, including a dashboard image
      # whose own build had nothing wrong with it. Containing that is the difference between
      # rerunning one job and rerunning a whole release.
      fail-fast: false
      # And the likely reason the daemon dies at all: every image built concurrently on one
      # runner. Two at a time still parallelises the slow Go builds without asking one machine to
      # host six simultaneous docker builds. Raise this once the daemon is understood — it is a
      # throughput knob, not a correctness one.
      max-parallel: 2
      matrix:
        include:
          - image: sentinel-ingestor
            dockerfile: apps/ingestor-go/Dockerfile
            context: .
          - image: sentinel-processor
            dockerfile: apps/processor-go/Dockerfile
            context: .
          - image: sentinel-dashboard
            dockerfile: apps/dashboard-web/Dockerfile
            context: .
          - image: sentinel-db-migrate
            dockerfile: packages/db-migrations/Dockerfile
            context: packages/db-migrations
          - image: sentinel-dlq-drainer
            dockerfile: scripts/Dockerfile.dlq-drainer
            context: .
          - image: sentinel-nats-init
            dockerfile: scripts/Dockerfile.nats-init
            context: scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Generate SWR login password (HMAC-SHA256)
        id: derive-swr-password
        env:
          SWR_REGION: ${{ secrets.SWR_REGION }}
          SWR_AK: ${{ secrets.SWR_ACCESS_KEY }}
          SWR_SK: ${{ secrets.SWR_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SWR_REGION:-}" ] || [ -z "${SWR_AK:-}" ] || [ -z "${SWR_SK:-}" ]; then
            echo "::error::Missing required SWR secret (SWR_REGION/SWR_ACCESS_KEY/SWR_SECRET_KEY). SWR_SECRET_KEY must be RAW SK from credentials.csv, not pre-hashed." >&2
            exit 1
          fi
          if command -v xxd >/dev/null 2>&1; then
            SWR_LOGIN_PWD=$(printf '%s' "$SWR_AK" | openssl dgst -binary -sha256 -hmac "$SWR_SK" | xxd -p -c 256)
          else
            SWR_LOGIN_PWD=$(printf '%s' "$SWR_AK" | openssl dgst -binary -sha256 -hmac "$SWR_SK" | od -An -vtx1 | tr -d ' \t\n\r')
          fi
          if [ -z "$SWR_LOGIN_PWD" ]; then
            echo "::error::Failed to derive SWR login password" >&2
            exit 1
          fi
          echo "::add-mask::$SWR_LOGIN_PWD"
          echo "swr_login_password=$SWR_LOGIN_PWD" >> "$GITHUB_OUTPUT"

      - name: Login to Huawei SWR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com
          username: ${{ secrets.SWR_REGION }}@${{ secrets.SWR_ACCESS_KEY }}
          password: ${{ steps.derive-swr-password.outputs.swr_login_password }}

      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@d0834ad3a60a024346910e522a81b0002bd37fea # v4.3.0
        with:
          role-to-assume: arn:aws:iam::576329195570:role/github-actions-ecr-push
          aws-region: ap-southeast-1
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Single build (one digest/layer set), pushed to both registries. The
          # ECR repo name is the bare matrix image (sentinel-ingestor, …) which
          # matches the clean repo names created in infra shared/ecr — the
          # reusable build-docker.yml would prefix daya-engineering/ instead.
          tags: |
            swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/daya-engineering/${{ matrix.image }}:${{ inputs.version_tag || github.ref_name }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image }}:${{ inputs.version_tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Cleanup docker credentials
        if: always()
        run: rm -f ~/.docker/config.json 2>/dev/null || true

  gate-staging:
    name: Gate Staging Environment
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","tuju-ai-runner"]') }}
    timeout-minutes: 5
    needs: [build-images]
    environment: staging
    steps:
      - run: echo "Staging gate passed for ${{ github.ref_name }}"

  deploy-eks-staging:
    name: Deploy Staging Environment (AWS EKS)
    needs: [gate-staging]
    uses: tuju-ai/workflow/.github/workflows/deploy-argocd-app.yml@8418659eb2d57ed605a35f74c96fe14d5b6482ec # main as of 2026-09-27, workflow#312 source_position
    with:
      runner: ${{ vars.CI_RUNNER_LABELS || '["self-hosted","linux","tuju-ai-runner"]' }}
      app_name: "sentinel-tuju-staging"
      source_position: "1"
      argocd_url: "argocd.staging.tuju.ai"
      argocd_username_aws_ssm_parameter_store_path: "/infra/tuju-staging/argocd/ARGOCD_USERNAME"
      argocd_password_aws_ssm_parameter_store_path: "/infra/tuju-staging/argocd/ARGOCD_PASSWORD"
      # init.nats.tag is injected even though init.nats is disabled in
      # values.aws.staging.yml; the Job is only rendered when that gate opens,
      # and the tag is then already correct.
      parameters: |
        images.ingestor.tag=${{ inputs.version_tag || github.ref_name }}
        images.processor.tag=${{ inputs.version_tag || github.ref_name }}
        images.dashboard.tag=${{ inputs.version_tag || github.ref_name }}
        images.migrate.tag=${{ inputs.version_tag || github.ref_name }}
        images.dlqDrainer.tag=${{ inputs.version_tag || github.ref_name }}
        init.nats.tag=${{ inputs.version_tag || github.ref_name }}
      sync: true
      wait: true
      wait_timeout: 600

  deploy-staging:
    name: Deploy Staging Environment (Huawei CCE)
    # Serialized AFTER the EKS deploy on purpose. Both jobs call the same reusable
    # workflow, which installs the ArgoCD CLI to the fixed paths /tmp/argocd +
    # /usr/local/bin/argocd. The self-hosted runner pool shares those paths, so
    # two concurrent calls race (`Text file busy` on the mv, or a vanished
    # /tmp/argocd). EKS goes first because it is the migration target; CCE is the
    # rollback origin and can wait.
    needs: [gate-staging, deploy-eks-staging]
    uses: tuju-ai/workflow/.github/workflows/deploy-argocd-app.yml@e018b36b69eff3903e9f4e2875063afd7d63bba0 # main as of 2026-09-08, PR #128 atomic app set & in-flight sync retry
    with:
      runner: ${{ vars.CI_RUNNER_LABELS || '["self-hosted","linux","tuju-ai-runner"]' }}
      app_name: "sentinel-staging"
      argocd_url: "argocd.daya.ai"
      argocd_username_aws_ssm_parameter_store_path: "/infra/hwc-daya-cce-production/argocd/ARGOCD_USER"
      argocd_password_aws_ssm_parameter_store_path: "/infra/hwc-daya-cce-production/argocd/ARGOCD_PASSWORD"
      parameters: |
        images.ingestor.tag=${{ inputs.version_tag || github.ref_name }}
        images.processor.tag=${{ inputs.version_tag || github.ref_name }}
        images.dashboard.tag=${{ inputs.version_tag || github.ref_name }}
        images.migrate.tag=${{ inputs.version_tag || github.ref_name }}
        images.dlqDrainer.tag=${{ inputs.version_tag || github.ref_name }}
        init.nats.tag=${{ inputs.version_tag || github.ref_name }}
      sync: true
      wait: true
      wait_timeout: 600
