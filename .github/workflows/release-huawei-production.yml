      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@d0834ad3a60a024346910e522a81b0002bd37fea # v4.3.0
        with:
          role-to-assume: arn:aws:iam::576329195570:role/github-actions-ecr-push
          aws-region: ap-southeast-1
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Single build pushed to AWS ECR only. The SWR tag below is disabled
          # since the 2026-10-03 post-cutover Huawei CI/CD switch-off — AWS EKS
          # is the live origin, Huawei CCE is frozen at 0 and never synced.
          # Restore by uncommenting the SWR tag line.
          # ECR repo name is the bare matrix image (sentinel-ingestor, …) which
          # matches the clean repo names created in infra shared/ecr — the
          # reusable build-docker.yml would prefix daya-engineering/ instead.
          # The SWR tag lives HERE, outside the block below: inside `tags: |` a `#` line is not a
          # YAML comment but literal text, which buildx rejected as an invalid tag (every release
          # from #82 until this fix failed at image build). To restore, add it back as a block line:
          #   swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/daya-engineering/${{ matrix.image }}:${{ inputs.version_tag || github.ref_name }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image }}:${{ inputs.version_tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Cleanup docker credentials
        if: always()
        run: rm -f ~/.docker/config.json 2>/dev/null || true

  gate-production:
    if: ${{ !endsWith(github.ref_name, '-staging') }}
    name: Gate Production Environment
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","tuju-ai-runner"]') }}
    timeout-minutes: 5
    needs: [build-images]
    environment: production
    steps:
      - run: echo "Production gate passed for ${{ github.ref_name }}"

  deploy-eks-production:
    name: Deploy Production Environment (AWS EKS)
    # EKS production is LIVE since the 2026-10-03 cutover — this job rolls the
    # new tags through the migrate hook into the 2/2 Deployments. The Huawei
    # CCE leg below it is disabled (frozen at 0, never synced).
    if: ${{ !endsWith(github.ref_name, '-staging') }}
    needs: [gate-production]
    uses: tuju-ai/workflow/.github/workflows/deploy-argocd-app.yml@8418659eb2d57ed605a35f74c96fe14d5b6482ec # main as of 2026-09-27, workflow#312 source_position
    with:
      runner: ${{ vars.CI_RUNNER_LABELS || '["self-hosted","linux","tuju-ai-runner"]' }}
      app_name: "sentinel-tuju-production"
      source_position: "1"
      argocd_url: "argocd.tuju.ai"
      argocd_username_aws_ssm_parameter_store_path: "/infra/tuju-production/argocd/ARGOCD_USERNAME"
      argocd_password_aws_ssm_parameter_store_path: "/infra/tuju-production/argocd/ARGOCD_PASSWORD"
      parameters: |
        images.ingestor.tag=${{ inputs.version_tag || github.ref_name }}
        images.processor.tag=${{ inputs.version_tag || github.ref_name }}
        images.dashboard.tag=${{ inputs.version_tag || github.ref_name }}
        images.migrate.tag=${{ inputs.version_tag || github.ref_name }}
        images.dlqDrainer.tag=${{ inputs.version_tag || github.ref_name }}
        init.nats.tag=${{ inputs.version_tag || github.ref_name }}
      sync: true
      wait: true
      wait_timeout: 600

