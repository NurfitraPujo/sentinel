version: "3.8"

services:
    postgres:
        image: postgres:15-alpine
        container_name: sentinel-postgres
        environment:
            POSTGRES_USER: sentinel
            POSTGRES_PASSWORD: changeme
            POSTGRES_DB: sentinel
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U sentinel"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: sentinel-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    nats:
        image: nats:2.10-alpine
        container_name: sentinel-nats
        # Host ports are parameterized because 4222/8222 are the default NATS ports and therefore the
        # ports another stack on the same machine is most likely to have already taken — rootless podman
        # then fails the whole `up` with "listen tcp 0.0.0.0:4222: bind: address already in use", and
        # every service that depends on nats (nats-init, ingestor, processor, dashboard) silently never
        # starts. The defaults are unchanged, so CI and a clean machine behave exactly as before; set
        # NATS_HOST_PORT / NATS_MONITOR_HOST_PORT to coexist with another NATS.
        #
        # Only the HOST side moves. In-cluster traffic uses nats://nats:4222 over the compose network and
        # is unaffected. Host-side clients — tests/e2e, tests/integration, tools/dlq — read NATS_URL.
        ports:
            - "${NATS_HOST_PORT:-4222}:4222"
            - "${NATS_MONITOR_HOST_PORT:-8222}:8222"
        volumes:
            - nats_data:/data
        command: ["-js", "--server_name", "sentinel-nats", "--sd", "/data/jetstream"]
        healthcheck:
            test: ["CMD", "nc", "-z", "localhost", "4222"]
            interval: 5s
            timeout: 5s
            retries: 10

    nats-init:
        build:
            context: ./scripts
            dockerfile: Dockerfile.nats-init
        depends_on:
            nats:
                condition: service_healthy
        environment:
            NATS_URL: nats://nats:4222
        restart: "no"

    migrate:
        image: golang:1.25-alpine
        container_name: sentinel-migrate
        working_dir: /workspace/packages/db-migrations
        volumes:
            - .:/workspace:ro
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DB_URL_PROCESSOR: postgres://sentinel:changeme@postgres:5432/sentinel?sslmode=disable
            DB_URL_INGESTOR: postgres://sentinel:changeme@postgres:5432/sentinel?sslmode=disable
            DB_URL_DASHBOARD: postgres://sentinel:changeme@postgres:5432/sentinel?sslmode=disable
        entrypoint: ["sh", "-c"]
        command:
            - "go run ./cmd/migrate up -target=processor"
        restart: "no"

    ingestor:
        build:
            context: .
            dockerfile: apps/ingestor-go/Dockerfile
        container_name: sentinel-ingestor
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
            nats:
                condition: service_healthy
            nats-init:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_USER: sentinel
            POSTGRES_PASSWORD: changeme
            POSTGRES_DB: sentinel
            NATS_URL: nats://nats:4222
            REDIS_ADDR: redis:6379
            REDIS_PASSWORD: ""
            REDIS_DB: 0
            RATELIMIT_STRICT_MODE: "false"

    processor:
        ports:
            - "8081:8081" # /health — includes dlq_depth (D10); see tools/dlq to replay
        build:
            context: .
            dockerfile: apps/processor-go/Dockerfile
        container_name: sentinel-processor
        depends_on:
            postgres:
                condition: service_healthy
            nats:
                condition: service_healthy
            nats-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
        environment:
            PROCESSOR_HEALTH_ADDR: ":8081"
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_USER: sentinel
            POSTGRES_PASSWORD: changeme
            POSTGRES_DB: sentinel
            NATS_URL: nats://nats:4222

    dashboard:
        build:
            context: .
            dockerfile: apps/dashboard-web/Dockerfile
        container_name: sentinel-dashboard
        ports:
            - "3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
            nats:
                condition: service_healthy
        environment:
            DATABASE_URL: postgres://sentinel:changeme@postgres:5432/sentinel
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_USER: sentinel
            POSTGRES_PASSWORD: changeme
            POSTGRES_DB: sentinel
            # Without this the dashboard cannot invalidate a revoked API key. createNatsPublisher in
            # src/lib/db/queries/apikeys.ts defaults to nats://localhost:4222, which inside a container is
            # nothing, so every api_key.invalidated publish failed with ECONNREFUSED and revocation
            # silently degraded from "<100ms" to "up to APIKEY_CACHE_TTL" (60s). Both sides of the feature
            # were correct and wired; only the deployment never connected them, and the fallback logs
            # rather than fails — so nothing surfaced it until U15/U16 measured 37s.
            NATS_URL: nats://nats:4222
            AUTH_SECRET: dev-only-insecure-secret-change-me-please-32chars
            AUTH_URL: http://localhost:3000
            AUTH_TRUST_HOST: "true"
            GOOGLE_CLIENT_ID: ""
            GOOGLE_CLIENT_SECRET: ""
            EMAIL_SERVER: smtp://debug
            EMAIL_FROM: noreply@sentinel.local
            SETTINGS_ENCRYPTION_KEY: default-long-and-secure-key-32-chars
            CRON_SECRET: dev-only-cron-secret-change-me
            DATA_RETENTION_DAYS: "30"

volumes:
    postgres_data:
    nats_data:
    redis_data:
