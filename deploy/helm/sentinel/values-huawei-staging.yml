# Huawei CCE staging values for the Sentinel chart.
#
# ⚠ FROZEN 2026-09-27 (cloud-migration.todo.md §3.1/§3.8) — replicas are pinned
# to 0, the HPAs are disabled, and retention/oncall cron + the DLQ drainer are
# off. sentinel-staging has been dumped and restored onto
# rds.staging.internal.tuju.ai and the service now runs on AWS EKS staging
# (deploy/helm/sentinel/values.aws.staging.yml). Nothing may write to Huawei
# again until the burn-in ends, otherwise AWS goes stale.
#
# Why this is in git and not just a `kubectl scale`: the release workflow
# deploys to BOTH clusters (deploy-eks-staging first, then this CCE app). A
# staging release tag would otherwise sync these manifests and scale the
# Huawei replicas straight back up. Freezing the values makes the tag-driven
# release safe to use, and documents the freeze where the next reader looks.
# The autoscaling blocks must be disabled rather than left at minReplicas: 2 —
# the chart only renders the Deployment's `replicas` field when the HPA is off,
# so an enabled HPA would keep a floor of 2 under the freeze.
#
# Fill every PLACEHOLDER before installing:
#   - sealedData: paste kubeseal-encryptor ciphertext scoped to the
#     sentinel-staging namespace (see RUNBOOK.md). Never commit plaintext.
#   - externalServices IPs: managed RDS / DCS Redis private IPs (10.200.x.x).
#   - S3_* : OBS endpoint / bucket / browser-reachable public endpoint.
#   - elbId / tlsCertIds: reuse cdc's shared internal ELB unless the platform
#     team provisions a Sentinel-specific one.
#
# Render check (no cluster needed):
#   helm template sentinel . -f values-huawei-staging.yml

global:
  provider: huawei

imagePullPolicy: IfNotPresent
imagePullSecrets:
  - name: default-secret

nodeSelector:
  node_type: spot

# -----------------------------------------------------------------------------
# First-party images. All built from this repo and pushed to SWR
# (swr.ap-southeast-3.myhuaweicloud.com/daya-engineering). Tags default to
# Chart.AppVersion; the release workflows --set image.tag to the git tag.
# -----------------------------------------------------------------------------
images:
  ingestor:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-ingestor
    tag: ""
  processor:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-processor
    tag: ""
  dashboard:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-dashboard
    tag: ""
  migrate:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-db-migrate
    tag: ""
  dlqDrainer:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-dlq-drainer
    tag: ""

secrets:
  create: false
  existingSecret: ""
  backend: sealed
  # kubeseal-encryptor ciphertext, scope: namespace sentinel-staging.
  # Replace every PLACEHOLDER via the encryptor API before installing.
  sealedData:
    POSTGRES_PASSWORD: ""
    REDIS_PASSWORD: ""
    S3_ACCESS_KEY: ""
    S3_SECRET_KEY: ""
    AUTH_SECRET: ""
    SETTINGS_ENCRYPTION_KEY: ""
    SENTINEL_ENCRYPTION_KEY: ""
    CRON_SECRET: ""
    EMAIL_SERVER: ""
    # Shared-cluster NATS DSN (with credentials) — seal via kubeseal-encrypt-string
    # scoped to namespace sentinel-staging, name sentinel-sentinel-secrets.
    NATS_URL: ""
    # sentinel-event-enrichment TASK-07: sealed by the operator 2026-09-24 via kubeseal-encryptor,
    # scope namespace sentinel-staging, name sentinel-sentinel-secrets. Read only by the geoip-refresh CronJob.
    MAXMIND_ACCOUNT_ID: ""
    MAXMIND_LICENSE_KEY: ""
    GITHUB_CLIENT_ID: ""
    GITHUB_CLIENT_SECRET: ""

# -----------------------------------------------------------------------------
# Managed VPC endpoints. CCE Standard cannot route pod traffic to these IPs
# directly, so each entry also renders a selector-less Service + Endpoints
# (templates/external-services.yaml) that apps dial by in-cluster DNS name.
# -----------------------------------------------------------------------------
externalServices:
  - name: rds-postgres-sentinel
    ip: 10.200.38.64
    port: 5432
  - name: dcs-redis-sentinel
    ip: 10.200.49.78
    port: 6379

config:
  postgres:
    host: rds-postgres-sentinel
    port: 5432
    user: sentinel-user
    database: sentinel-staging
    sslmode: require
  nats:
    # Shared cluster NATS (authenticated DSN sealed as NATS_URL) — bundled off.
    url: ""
  redis:
    addr: "dcs-redis-sentinel:6379"
    # DB 1: the shared DCS instance also serves cdc-pipeline on DB 0 —
    # a dedicated index avoids key collisions. Confirm index 1 is free.
    db: 1
  s3:
    endpoint: "https://obs.ap-southeast-3.myhuaweicloud.com"
    publicEndpoint: "https://obs.ap-southeast-3.myhuaweicloud.com"
    bucket: sentinel-staging
  otel:
    exporterEndpoint: ""
  dashboard:
    authUrl: "https://sentinel-stg.daya.ai"
    authTrustHost: "true"
    emailFrom: "noreply@daya.ai"
    dataRetentionDays: "30"
    reportMatchWindowMinutes: "30"
    escalationAckMinutes: "15"
    escalationMaxHops: "3"
    reportUploadRpm: "10"
    reportUploadBytesPerDay: "262144000"
    claimStaleHours: "24"
    manualIssueRetentionDays: "365"
    # sentinel-sourcemaps §12 (value syntax beside each key in values.yaml). Same as the chart
    # defaults; listed so this block stays the complete list of dashboard knobs for the env.
    bodySizeLimit: "110M"
    sourcemapMaxBytes: "52428800"
    sourcemapMaxFilesPerRequest: "50"
    sourcemapMaxFilesPerRelease: "2000"
  ingestor:
    ratelimitStrictMode: "true"
    # Contract decision 11: no forwarding header is believed on Huawei. The tunnel writes the browser's
    # IP into the body. Phase 4 (public endpoint) configures this; do not add node, pod or ELB ranges
    # here. (sentinel-event-enrichment spec §3.3, §3.6; tests/unit/helm_geoip_test.go asserts it empty.)
    trustedProxyCidrs: []

migrate:
  enabled: true
  targets:
    - processor
    - ingestor
    - dashboard

ingestor:
  replicaCount: 0
  containerPort: 8080
  service:
    type: NodePort
    port: 8080
    nodePort: 31123
  ingress:
    enabled: true
    host: api-sentinel-stg.daya.ai
    elbId: 99ed1830-9f66-4ba4-84e2-3d1b819eaf55
    tlsCertIds: ef8353e34fcd412699b149970aca8995,ef8353e34fcd412699b149970aca8995
  autoscaling:
    enabled: false
    minReplicas: 0
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    # 256Mi: the resident GeoLite2-City database (sentinel-event-enrichment spec §8.4).
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# sentinel-event-enrichment (spec §8.3, §8.4): geo from GeoLite2-City in this env's OBS bucket. Storage is
# pinned to the same endpoint and bucket as config.s3; the AWS S3 move edits these lines and the key names.
geoip:
  enabled: true
  storage:
    endpoint: "https://obs.ap-southeast-3.myhuaweicloud.com"
    bucket: sentinel-staging
    region: "us-east-1"
    prefix: "geoip/"
  refreshCron:
    enabled: true

processor:
  replicaCount: 0
  healthPort: 8081
  service:
    type: ClusterIP
    port: 8081
  autoscaling:
    enabled: false
    minReplicas: 0
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    # 1Gi with values.yaml's processor.gomemlimit (800MiB, NOT overridden here): the two are
    # derived together from §13 M2's parsed:raw ratio -- the arithmetic is in values.yaml beside
    # gomemlimit. Lowering this alone puts the Go soft limit above the kernel's.
    limits: { cpu: "1", memory: 1Gi }

dashboard:
  replicaCount: 0
  containerPort: 3000
  service:
    type: NodePort
    port: 3000
    nodePort: 31124
  ingress:
    enabled: true
    host: sentinel-stg.daya.ai
    elbId: 99ed1830-9f66-4ba4-84e2-3d1b819eaf55
    tlsCertIds: ef8353e34fcd412699b149970aca8995,ef8353e34fcd412699b149970aca8995
  autoscaling:
    enabled: false
    minReplicas: 0
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

# Bundled stateful deps: all OFF on Huawei — managed/shared equivalents above.
dependencies:
  postgres:
    enabled: false
  nats:
    enabled: false
  redis:
    enabled: false
  minio:
    enabled: false

# sentinel-span-ingest: Tempo is shared with production; ingest and pull stay off here (mobile staging sends no
# transactions, and no organization is allow-listed) until someone needs them.
spans:
  enabled: false
  pull:
    scopes: ""
    storeKind: tempo
    storeUrl: http://tempo.tempo-production.svc:3100

init:
  nats:
    # Off while frozen. The streams AND consumers already exist on the CCE
    # cluster, and scripts/nats-init.sh calls `nats consumer add` with no
    # existence guard under `set -e` — so a sync would fail the wave-1 `Sync`
    # hook Job on the existing processor-consumer. Same reason it is off on AWS.
    enabled: false
    image: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-nats-init
    tag: ""
    # ERROR_EVENTS limits on the shared-cluster JetStream store (infra
    # k8s/hcs/argocd/cluster/nats/helm-values.staging.yaml: fileStore.pvc.size 50Gi, maxSize 50Gi).
    # 20 events/s x 5 KiB x 24h = 8.24 GiB <= 10GiB, ~22% of the store with the DLQ and control-plane
    # streams counted - the derivation is scripts/nats-init.sh's ERROR_EVENTS block. Re-size here
    # (and re-run the init job) rather than in the script; the script's defaults are the same numbers.
    errorEvents:
      maxAge: "24h"
      maxBytes: "10GiB"
  minio:
    enabled: false
    image: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-minio-init
    tag: ""

# Legacy combined ingress renders nothing when provider == huawei.
ingress:
  enabled: false

retentionCron:
  enabled: false
  schedule: "0 * * * *"

oncallCron:
  enabled: false

prometheusRule:
  enabled: false

dlqDrainer:
  enabled: false
  drainerEnabled: "false"
  drainerExecute: "false"
  # CCE has no default StorageClass — Everest CSI csi-disk provisions EVS.
  persistence:
    storageClass: "csi-disk"

serviceAccount:
  create: true
  name: ""
  annotations: {}
