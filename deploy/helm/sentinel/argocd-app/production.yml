apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tuju-ai/sentinel.git
    path: deploy/helm/sentinel
    targetRevision: main
    helm:
      version: v3
      releaseName: sentinel
      valueFiles:
        - values-huawei-production.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel-production
  syncPolicy:
    # Manual sync only: production deploys via the release workflow's
    # environment gate + explicit `argocd app sync`, never auto-sync.
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
