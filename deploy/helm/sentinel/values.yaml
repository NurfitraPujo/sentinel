# Default values for the Sentinel chart.
# These defaults render a WORKING but NON-PRODUCTION stack (bundled deps, in-repo secrets).
# For production, copy values-prod-example.yaml, disable the bundled dependencies, and supply
# real secrets via `existingSecret` or an external secret manager. See ../../../DEPLOYMENT.md.

# -----------------------------------------------------------------------------
# Global settings shared by every service.
# -----------------------------------------------------------------------------
global:
  # Cloud target. "generic" keeps the demo/nginx path; "huawei" enables the CCE
  # ingresses and external-services. Huawei env files set this to "huawei".
  provider: generic
  # Prefix for image repositories. Leave empty to use the fully-qualified repos below as-is.
  imageRegistry: ""
  imagePullSecrets: []
  # A namespace-wide name prefix is derived from the release name; see _helpers.tpl.

# Common image pull policy for first-party images.
imagePullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# First-party application images. Point these at your registry + built tags.
# The three app Dockerfiles live at apps/<svc>/Dockerfile in the repo.
# -----------------------------------------------------------------------------
images:
  ingestor:
    repository: ghcr.io/nurfitrapujo/sentinel/ingestor-go
    tag: "" # defaults to .Chart.AppVersion when empty
  processor:
    repository: ghcr.io/nurfitrapujo/sentinel/processor-go
    tag: ""
  dashboard:
    repository: ghcr.io/nurfitrapujo/sentinel/dashboard-web
    tag: ""
  # The migrate Job and dlq-drainer reuse a Go toolchain / the built tools image.
  migrate:
    repository: ghcr.io/nurfitrapujo/sentinel/db-migrate
    tag: ""
  dlqDrainer:
    repository: ghcr.io/nurfitrapujo/sentinel/dlq-drainer
    tag: ""

# -----------------------------------------------------------------------------
# Secrets. In production set `create: false` and reference a pre-provisioned Secret
# (e.g. from External Secrets Operator / Vault / cloud secret manager) via existingSecret.
# The Secret MUST contain every key listed under `data` below.
# -----------------------------------------------------------------------------
secrets:
  create: true
  existingSecret: "" # when set, `create` is ignored and this Secret name is mounted instead
  # Secret backend. "plain" renders the in-chart Secret from `data` (demo only).
  # "sealed" renders a SealedSecret from `sealedData` (Huawei CCE via
  # kubeseal-encryptor — seal per namespace, paste ciphertext into sealedData).
  backend: plain
  sealedData: {}
  # These INSECURE defaults exist only so `helm install` renders on a kicking-the-tyres cluster.
  # NEVER ship them. `helm lint`/CI should reject any release that keeps a `change-me` value.
  data:
    POSTGRES_PASSWORD: "change-me-postgres"
    REDIS_PASSWORD: ""
    S3_ACCESS_KEY: "change-me-s3-access"
    S3_SECRET_KEY: "change-me-s3-secret"
    # dashboard-only secrets
    AUTH_SECRET: "change-me-auth-secret-min-32-chars-long"
    SETTINGS_ENCRYPTION_KEY: "change-me-settings-key-exactly-32ch"
    # N10: base64 of exactly 32 random bytes (`openssl rand -base64 32`); repo-credential
    # endpoints return 503 until it is set to a real value.
    SENTINEL_ENCRYPTION_KEY: "change-me-base64-of-32-random-bytes"
    CRON_SECRET: "change-me-cron-secret"
    GOOGLE_CLIENT_ID: ""
    GOOGLE_CLIENT_SECRET: ""
    # SMTP DSN for invitation / magic-link email. Without it, invitations cannot be delivered
    # (a deliberate consequence of design decision D06). e.g. smtp://user:pass@smtp.host:587
    EMAIL_SERVER: ""

# -----------------------------------------------------------------------------
# Non-secret shared configuration (rendered into a ConfigMap).
# -----------------------------------------------------------------------------
config:
  postgres:
    # Host/port/user/db for ALL three services. Password comes from the Secret above.
    # When `dependencies.postgres.enabled`, host defaults to the bundled StatefulSet service.
    host: "" # empty => bundled postgres service name; set to your managed host in prod
    port: 5432
    user: sentinel
    database: sentinel
    # sslmode for the dashboard DATABASE_URL and migrate DB_URL_*. Use "require" or stricter in prod.
    sslmode: require
  nats:
    # empty => bundled nats service; else nats://host:4222 of your managed cluster
    url: ""
  redis:
    # empty => bundled redis service; else host:port
    addr: ""
    db: 0
  s3:
    # Server-side (in-cluster / VPC) endpoint used for all server S3 calls.
    # empty => bundled minio service; else e.g. https://s3.us-east-1.amazonaws.com or an R2 endpoint.
    endpoint: ""
    # Browser-reachable endpoint used ONLY to sign presigned PUT URLs (M6 large uploads).
    # MUST be resolvable from end-user browsers. SigV4 signs the host, so a wrong value here
    # makes large uploads fail from the browser while server-side uploads keep working.
    publicEndpoint: "https://uploads.example.com"
    bucket: sentinel-attachments
  otel:
    # OTLP HTTP collector endpoint. Empty disables trace export (services stay fully functional).
    exporterEndpoint: ""
  dashboard:
    # Public URL of the dashboard (Auth.js AUTH_URL). MUST be the externally-visible https URL.
    authUrl: "https://sentinel.example.com"
    authTrustHost: "true"
    emailFrom: "noreply@sentinel.example.com"
    dataRetentionDays: "30"
    # sentinel-user-report-issue §8's config knobs, with the defaults the contract states.
    # There is no feature flag here and that is the decision, not an omission: the `report` key
    # scope IS the switch (OQ-3), and no key that exists today carries it.
    #
    # §4.3's triage window: how far back the matcher looks for candidate error issues.
    reportMatchWindowMinutes: "30"
    # §4.4's acknowledgement deadline, in minutes. Lengthening it past the sweep interval is safe;
    # shortening it below one sweep period is not, since the sweep is what enforces it.
    escalationAckMinutes: "15"
    # §4.4's bound. "It does not loop the rotation forever — a pager that keeps moving is a pager
    # nobody owns."
    escalationMaxHops: "3"
    # §4.5's per-key upload throttle and rolling-24h byte ceiling (SR-5, counted in Postgres).
    reportUploadRpm: "10"
    reportUploadBytesPerDay: "262144000"
    # Health endpoints the observability page reads. Left empty on purpose: the configmap then
    # derives in-cluster service DNS from the release name, which is correct for every normal
    # deployment. Set these only when processor/ingestor are reachable somewhere else.
    processorHealthUrl: ""
    ingestorHealthUrl: ""
    # Retention-cron knobs (N9). Code defaults are 24 / 365; set explicitly
    # per env to make them visible and tunable.
    claimStaleHours: "24"
    manualIssueRetentionDays: "365"
    # sentinel-sourcemaps §4.1 / §12: the upload route's caps and the adapter's body limit.
    # Every value here is a STRING in the syntax the reader of the variable expects -- the
    # operator turning one reads nothing else.
    #
    # BODY_SIZE_LIMIT -- adapter-node's own syntax: an integer with an optional K/M/G suffix.
    # Without it the adapter 413s every real map before the route runs (adapter-node defaults to
    # 512KB); 110M covers two 50 MiB maps plus multipart overhead in one request.
    # docker-compose.yml sets the same variable for the same reason.
    bodySizeLimit: "110M"
    # SOURCEMAP_MAX_BYTES -- plain integer bytes, per file part. 52428800 = 50 MiB (decision 10).
    sourcemapMaxBytes: "52428800"
    # SOURCEMAP_MAX_FILES_PER_REQUEST / SOURCEMAP_MAX_FILES_PER_RELEASE -- plain integers
    # (decision 10). A request over the first is 400; a release that would exceed the second is
    # 422 release_full with nothing written (§4.1).
    sourcemapMaxFilesPerRequest: "50"
    sourcemapMaxFilesPerRelease: "500"
  ingestor:
    # When true, requests with an unresolvable API key are rejected rather than soft-allowed.
    ratelimitStrictMode: "true"
  processor:
    # sentinel-sourcemaps §12: the symbolication knobs (decisions 9, 11, 27, 37, 38). Rendered as
    # plain env on the processor container (templates/processor.yaml), never in the ConfigMap the
    # other two services also read. Every value is a STRING in the syntax stated beside it -- the
    # operator turning one reads nothing else. S3_ENDPOINT/S3_BUCKET reach the processor via the
    # ConfigMap already; S3_ACCESS_KEY/S3_SECRET_KEY come from the Secret (the same two keys the
    # dashboard mounts). There is no chart switch for the startup check: a processor with a
    # non-empty SYMBOLICATE_PLATFORMS and no S3 credentials log.Fatalf's before it subscribes
    # (decision 32) -- see RUNBOOK.md §2's pre-deploy check.
    #
    # SYMBOLICATE_PLATFORMS -- comma-separated lowercase list of `platform` values the stage (and
    # §4.4's frame normalisation) runs for. Unset = "javascript,browser"; set-and-EMPTY = off,
    # which is the kill switch (decision 27) -- so this key must stay present and non-empty to
    # keep symbolication on.
    symbolicatePlatforms: "javascript,browser"
    # SOURCEMAP_CACHE_BYTES -- plain integer bytes of RAW map size the in-process cache holds
    # before evicting (decision 11). No Mi/M suffix. 134217728 = 128 MiB. The parsed maps the
    # cache actually holds are a multiple of this; see gomemlimit under `processor:` below.
    sourcemapCacheBytes: "134217728"
    # SOURCEMAP_NEGATIVE_TTL -- Go duration string. How long a "no map for this frame" answer is
    # remembered (decision 9); a map uploaded inside this window is not seen until it expires.
    # docker-compose.yml sets 5s so the e2e case does not wait it out.
    sourcemapNegativeTtl: "60s"
    # SOURCEMAP_POSITIVE_TTL -- Go duration string. How long a parsed map is served before it is
    # re-fetched; a replaced map propagates within this per pod (Known limit 3).
    sourcemapPositiveTtl: "10m"
    # SYMBOLICATE_DEADLINE -- Go duration string. Per-event wall-clock bound on cold fetch+parse
    # (decision 37): past it the event's unresolved frames pass through `timeout` and the fill
    # finishes in the background. Raising it means raising the NATS AckWait in
    # apps/processor-go/main.go with it (>= BatchSize x this deadline) -- that follows in code,
    # not here.
    symbolicateDeadline: "5s"
    # SOURCEMAP_MAX_PARSE_BYTES -- plain integer bytes. A `sourcemaps` row whose size_bytes is
    # over this is never fetched (`oversize`, decision 38): the lever that keeps the biggest maps
    # out of RSS. Default = the upload cap (SOURCEMAP_MAX_BYTES, 52428800).
    sourcemapMaxParseBytes: "52428800"

# -----------------------------------------------------------------------------
# External managed endpoints (Huawei CCE only). Each entry renders a
# selector-less Service + Endpoints bridging the in-cluster name to the VPC
# private IP. Empty (default) renders nothing. Huawei env files define
# rds-postgres-sentinel / dcs-redis-sentinel here.
# -----------------------------------------------------------------------------
externalServices: []

# -----------------------------------------------------------------------------
# Database migration Job. Runs `migrate up` for every target as a pre-install/pre-upgrade hook.
# -----------------------------------------------------------------------------
migrate:
  enabled: true
  # Which goose targets to migrate. Each shares one physical database (see A1 in the repo).
  targets:
    - processor
    - ingestor
    - dashboard
  backoffLimit: 3
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# -----------------------------------------------------------------------------
# ingestor-go — the only externally exposed first-party service (error ingest :8080).
# -----------------------------------------------------------------------------
ingestor:
  replicaCount: 2
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
    # Set with type: NodePort on Huawei CCE (verified-free ports per env file).
    nodePort: null
  # Huawei CCE ingress (ingestor-ingress.yaml). Ignored unless
  # global.provider == "huawei".
  ingress:
    enabled: false
    host: ""
    elbId: ""
    tlsCertIds: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # HTTP probes hit /health on the container port.
  livenessPath: /health
  readinessPath: /health

# -----------------------------------------------------------------------------
# processor-go — NATS consumer, no inbound app traffic. :8081 serves /health,/metrics,/dlq.
# -----------------------------------------------------------------------------
processor:
  replicaCount: 2
  healthPort: 8081
  service:
    # Headless-ish ClusterIP so Prometheus can scrape /metrics; no external exposure.
    type: ClusterIP
    port: 8081
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # GOMEMLIMIT -- a Go memory-limit string (the runtime's own syntax: an integer with an optional
  # B/KiB/MiB/GiB suffix, e.g. 400MiB), and it MUST stay below resources.limits.memory above so
  # the runtime collects before the kernel OOM-kills (sentinel-sourcemaps decision 35). The
  # symbolication cache accounts RAW map bytes (config.processor.sourcemapCacheBytes) and holds
  # parsed maps that are a multiple of that, so the gauge under-reads real usage; this value is
  # derived, not asserted: sourcemapCacheBytes x parsed:raw ratio + baseline < GOMEMLIMIT, with the
  # ratio the §13 M2 measurement reports. Raise the memory limit and this together.
  gomemlimit: "400MiB"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  livenessPath: /health
  readinessPath: /health

# -----------------------------------------------------------------------------
# dashboard-web — SvelteKit UI + JSON API (:3000).
# -----------------------------------------------------------------------------
dashboard:
  replicaCount: 2
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
    # Set with type: NodePort on Huawei CCE (verified-free ports per env file).
    nodePort: null
  # Huawei CCE ingress (dashboard-ingress.yaml). Ignored unless
  # global.provider == "huawei".
  ingress:
    enabled: false
    host: ""
    elbId: ""
    tlsCertIds: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  livenessPath: /
  readinessPath: /

# -----------------------------------------------------------------------------
# dlq-drainer — scheduled DLQ maintenance. Ships gated OFF (matches compose default).
# -----------------------------------------------------------------------------
dlqDrainer:
  enabled: true
  # Both must be true for anything destructive to happen (see tools/dlq + D14).
  drainerEnabled: "false"
  drainerExecute: "false"
  stream: ERROR_EVENTS_DLQ
  intervalSeconds: "3600"
  limit: "50"
  maxReplays: "3"
  stateFile: /var/lib/dlq-drainer/state.json
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# -----------------------------------------------------------------------------
# retention-cron — schedules POST /api/cron/retention (N9). A batch/v1 CronJob that runs a short
# curl Job on `schedule`, POSTing the in-cluster dashboard Service with CRON_SECRET (from the chart
# Secret). The same run force-releases stale agent claims (CLAIM_STALE_HOURS) and applies retention
# windows. Ships ENABLED — unlike the destructive dlq-drainer, this only invokes an endpoint that is
# itself the authority on what it deletes, and a stack with no scheduler leaks crashed-agent claims.
# -----------------------------------------------------------------------------
retentionCron:
  enabled: true
  # Standard cron syntax (cluster timezone). Default: hourly, matching the compose interval.
  schedule: "0 * * * *"
  image:
    # A plain curl image — the Job only makes one HTTP POST, no first-party code.
    repository: docker.io/curlimages/curl
    tag: "8.7.1"
  timeoutSeconds: 30
  # If the controller misses a scheduled time by more than this (e.g. controller downtime), skip it.
  startingDeadlineSeconds: 120
  # Kill a run that hangs past this so a wedged Job cannot block the next (concurrencyPolicy: Forbid).
  activeDeadlineSeconds: 120
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

# -----------------------------------------------------------------------------
# oncall-escalation cron — sentinel-user-report-issue §4.4b. A SECOND scheduled job, not a
# widening of retentionCron above: retention runs hourly and a 15-minute acknowledgement deadline
# swept hourly is a 75-minute deadline. This one runs every minute.
#
# Ships OFF, per this chart's convention for scheduled jobs and per §4.4b's "off by default". §12
# names the consequence of leaving it off: escalation-at-intake still assigns the on-call engineer,
# but an unacknowledged deadline never reassigns, and the prometheusRule alerts below are the only
# thing that notices.
# -----------------------------------------------------------------------------
oncallCron:
  enabled: false
  # Every minute. §4.4b fixes this value; it is not a tuning knob in the way retention's is.
  schedule: "*/1 * * * *"
  image:
    # The same plain curl image retentionCron uses — the Job only makes one HTTP POST.
    repository: docker.io/curlimages/curl
    tag: "8.7.1"
  timeoutSeconds: 20
  # A minute-period job that misses its slot by more than this should be skipped rather than
  # stacked: the next run is 60 seconds away and will find the same due rows.
  startingDeadlineSeconds: 45
  # Below the 60s period, so a wedged run cannot sit in front of the next one under Forbid.
  activeDeadlineSeconds: 50
  # No retries: the next scheduled run is a minute away and the sweep is idempotent, so a retry
  # buys nothing a re-run does not.
  backoffLimit: 0
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

# -----------------------------------------------------------------------------
# PrometheusRule — sentinel-user-report-issue §12's alert rules. Ships OFF because the CRD belongs
# to the Prometheus Operator; enabling it on a cluster without the operator fails the release on an
# unknown kind. See templates/prometheusrule.yaml for why the rules live in this chart at all.
# -----------------------------------------------------------------------------
prometheusRule:
  enabled: false
  # Extra labels the cluster's Prometheus uses to select rule objects (e.g. `release: kube-prom`).
  labels: {}
  # Evaluation window for the two "above zero" signals. Long enough that one scrape gap cannot
  # clear a real exhaustion, short enough to page while the report still matters.
  window: 15m
  # Both signals are counters of events that already happened; a `for` beyond one evaluation cycle
  # would only delay a page nobody can un-fire.
  for: 5m
  # The stalled-escalation backstop compares two counters over the same window, so the window has
  # to be long enough for a normal quiet period not to look like a stall.
  stalledWindow: 1h
  severity:
    exhausted: critical
    unresolved: warning
    stalled: warning
    # The sentinel-sourcemaps group (DORMANT until a Prometheus consumes Sentinel's rules — see the
    # group's header in templates/prometheusrule.yaml). All warning: every one degrades to
    # pass-through and none stops ingest (contract §12, *Failure modes*).
    sourcemapFetchErrors: warning
    sourcemapCacheThrash: warning
    sourcemapUploadStorageErrors: warning

# -----------------------------------------------------------------------------
# Ingress. Two hosts: the dashboard UI and the ingestor ingest endpoint.
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    # One secret per host, or a shared wildcard cert. cert-manager can populate these.
  dashboard:
    host: sentinel.example.com
    tlsSecret: sentinel-dashboard-tls
  ingestor:
    host: ingest.example.com
    tlsSecret: sentinel-ingest-tls
    # Large-payload note: ingest bodies are small, but bump proxy-body-size if you change limits.

# -----------------------------------------------------------------------------
# Bundled stateful dependencies. DISABLE these in production and use managed services
# (RDS/Cloud SQL, a managed NATS or self-run StatefulSet, ElastiCache/managed Redis,
# real S3/R2/GCS). Enabled here only so a demo cluster comes up with one command.
# -----------------------------------------------------------------------------
dependencies:
  postgres:
    enabled: true
    image: postgres:15-alpine
    storage:
      size: 20Gi
      storageClass: ""
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
  nats:
    enabled: true
    image: nats:2.10-alpine
    # JetStream file storage MUST be persistent — this is the durability boundary for the pipeline.
    storage:
      size: 20Gi
      storageClass: ""
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
  redis:
    enabled: true
    image: redis:7-alpine
    storage:
      size: 5Gi
      storageClass: ""
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 512Mi }
  minio:
    enabled: true
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    storage:
      size: 50Gi
      storageClass: ""
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }

# Optional: run the NATS/MinIO one-shot init steps as Jobs (create the JetStream streams /
# the attachments bucket). Disable if your managed deps are pre-provisioned.
init:
  nats:
    enabled: true
    image: ghcr.io/nurfitrapujo/sentinel/nats-init
    tag: ""
  minio:
    enabled: true
    image: ghcr.io/nurfitrapujo/sentinel/minio-init
    tag: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
