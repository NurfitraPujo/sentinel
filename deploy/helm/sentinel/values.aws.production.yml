# values.aws.production.yml — AWS EKS production values (dual-cloud chart).
# Ported from values-huawei-production.yml (Huawei CCE). Conventions vs CCE:
#   - global.provider=aws switches templates/secret.yaml to an ExternalSecret
#     (SSM Parameter Store via ESO) and gates off the CCE Ingresses +
#     externalServices Endpoints. No ciphertext in git, no in-chart plaintext.
#   - ENV_VAR -> full SSM path map under externalSecrets.secrets; seed each
#     path as SecureString (/tuju/production/sentinel/shared/<KEY>). Pinned
#     explicitly — no bulk dataFrom.find — to avoid the ESO path-flattening
#     trap (see cloud-migration.todo.md §4.5.2).
#   - Services are ClusterIP-only; edge routing is Emissary (infra repo owns
#     Hosts + Mappings: sentinel.tuju.ai -> dashboard, and
#     api-sentinel.tuju.ai -> ingestor). Wildcard Host *.tuju.ai? No — the
#     apex/cert covers tuju.ai; infra creates explicit Hosts where needed.
#   - No imagePullSecrets on EKS (same-account ECR via node instance role).
#   - Canonical production host: sentinel.tuju.ai (mirrors sentinel.daya.ai).
#
# DORMANT bootstrap: replicas 0 + every side-effecting hook OFF until the
# production cutover window (cloud-migration.todo.md §4.2e). `sentinel-production`
# is populated out-of-band by DMS (full load DONE, CDC running) — Goose
# migrations must NOT run before the cutover drains CCE:
#   migrate.enabled=false (no DB migrations), init.nats.enabled=false (no
#   JetStream stream creation — the §5 NATS cutover owns the streams),
#   dlqDrainer/retentionCron/oncallCron=false, autoscaling.enabled=false +
#   replicaCount=0. Re-enable at cutover.
#
# Pre-flight before first sync:
#   1. Create the 6 sentinel-* ECR repos (infra terraform/live/shared/ecr).
#   2. Seed /tuju/production/sentinel/shared/* (done 2026-09-26, 10/10).
#   3. Push sentinel images to ECR and pin the tags below (done — v0.2.43
#      verified in all six repos; replicas 0 means nothing pulls, but an
#      unpinned tag would ImagePullBackOff on scale-up).
#   4. Start the production cache (tuju-cache-production is stopped; Redis auth
#      must answer PONG before scale-up).

global:
  provider: aws
  environment: production
  org: tuju
  repoName: sentinel

environment: production

# CCE-only: manual Endpoints for Huawei private IPs. Empty on AWS (VPC DNS).
externalServices: []

# Cross-component secrets -> k8s Secret sentinel-sentinel-secrets (ExternalSecret).
externalSecrets:
  enabled: true
  storeName: aws-parameter-store
  secrets:
    POSTGRES_PASSWORD: "/tuju/production/sentinel/shared/POSTGRES_PASSWORD"
    REDIS_PASSWORD: "/tuju/production/sentinel/shared/REDIS_PASSWORD"
    NATS_URL: "/tuju/production/sentinel/shared/NATS_URL"
    AUTH_SECRET: "/tuju/production/sentinel/shared/AUTH_SECRET"
    CRON_SECRET: "/tuju/production/sentinel/shared/CRON_SECRET"
    EMAIL_SERVER: "/tuju/production/sentinel/shared/EMAIL_SERVER"
    SENTINEL_ENCRYPTION_KEY: "/tuju/production/sentinel/shared/SENTINEL_ENCRYPTION_KEY"
    SETTINGS_ENCRYPTION_KEY: "/tuju/production/sentinel/shared/SETTINGS_ENCRYPTION_KEY"
    S3_ACCESS_KEY: "/tuju/production/sentinel/shared/S3_ACCESS_KEY"
    S3_SECRET_KEY: "/tuju/production/sentinel/shared/S3_SECRET_KEY"

# -----------------------------------------------------------------------------
# First-party images (ECR, tuju prod account 576329195570, ap-southeast-1).
# Tags are pinned declaratively (not only via CI `argocd app set` parameters)
# so a fresh sync or an Application recreate can never fall back to
# Chart.AppVersion (0.1.0, in no registry) and wedge the app in
# ImagePullBackOff. Pinned to v0.2.43 — the newest production tag verified
# present in all six ECR repos and already carried as the live ArgoCD
# parameters, so this pin introduces zero diff. Nothing is pulled while
# replicas are 0, so the pin is inert until cutover.
# -----------------------------------------------------------------------------
images:
  ingestor:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-ingestor
    tag: "v0.2.43"
  processor:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-processor
    tag: "v0.2.43"
  dashboard:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-dashboard
    tag: "v0.2.43"
  migrate:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-db-migrate
    tag: "v0.2.43"
  dlqDrainer:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-dlq-drainer
    tag: "v0.2.43"

imagePullPolicy: IfNotPresent
imagePullSecrets: []

# EKSNodeGroupType selects the x86-64 spot pool (verified live on both
# clusters); kubernetes.io/arch+os are kubelet-guaranteed belt-and-braces so a
# drifted custom label can never reschedule amd64-only images onto Graviton.
nodeSelector:
  EKSNodeGroupType: medium-size-x86-64-spot
  kubernetes.io/arch: amd64
  kubernetes.io/os: linux
affinity: {}
tolerations: []

config:
  postgres:
    host: rds.production.internal.tuju.ai
    port: 5432
    user: tuju-sentinel-user
    database: sentinel-production
    # rds.force_ssl=0 on the AWS parameter group (matches core/webhook).
    sslmode: disable
  nats:
    # Authenticated DSN arrives via the Secret (NATS_URL) — see the helper.
    url: ""
  redis:
    addr: "redis.production.internal.tuju.ai:6379"
    # Dedicated index: AWS cache DB0=core, DB1=core-jobs+webhook, DB2=webhook-jobs.
    # Sentinel only caches API-key lookups + rate-limit counters (ephemeral), so
    # a fresh index is safe and avoids key collisions.
    db: "3"
  s3:
    # Huawei OBS retained during the migration window (mirrors core's OBS_* dual
    # run). Production S3 keys are real OBS credentials (verified 2026-09-26).
    endpoint: "https://obs.ap-southeast-3.myhuaweicloud.com"
    publicEndpoint: "https://obs.ap-southeast-3.myhuaweicloud.com"
    bucket: sentinel-production
  otel:
    exporterEndpoint: ""
  dashboard:
    authUrl: "https://sentinel.tuju.ai"
    authTrustHost: "true"
    # Kept on daya.ai for now (verified SES identity); rebrand at cutover.
    emailFrom: "noreply@daya.ai"
    dataRetentionDays: "30"
    reportMatchWindowMinutes: "30"
    escalationAckMinutes: "15"
    escalationMaxHops: "3"
    reportUploadRpm: "10"
    reportUploadBytesPerDay: "262144000"
    claimStaleHours: "24"
    manualIssueRetentionDays: "365"
  ingestor:
    ratelimitStrictMode: "true"
    # sentinel-sentry-compat-ingest (contract D15): empty = fail closed -- the relay's X-Forwarded-For and
    # X-Sentinel-Relay-* headers are ignored. core-sentinel-mobile-relay sets this at its rollout, by the
    # RUNBOOK entry "Sentry-compatible ingest: trusting core's relay". Narrowest CIDR only.
    sentryCompatTrustedProxyCidrs: []

# Dormant: no DB migration Job until the cutover window. `sentinel-production`
# is seeded by DMS; Goose runs must wait for CCE write-freeze.
migrate:
  enabled: false
  targets:
    - processor
    - ingestor
    - dashboard

ingestor:
  replicaCount: 0
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  ingress:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

processor:
  replicaCount: 0
  healthPort: 8081
  service:
    type: ClusterIP
    port: 8081
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

dashboard:
  replicaCount: 0
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
    nodePort: null
  ingress:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

# Bundled stateful deps: all OFF — managed/shared equivalents above.
dependencies:
  postgres:
    enabled: false
  nats:
    enabled: false
  redis:
    enabled: false
  minio:
    enabled: false

# Dormant: the §5 NATS cutover owns JetStream stream creation. Enable at cutover.
# Tag pinned to v0.2.43 (verified in ECR, matches live ArgoCD parameters) for
# the same ImagePullBackOff reason as images.* above.
init:
  nats:
    enabled: false
    image: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-nats-init
    tag: "v0.2.43"
  minio:
    # AWS: object storage is external (Huawei OBS during the migration window,
    # S3 after) — minio-init must NEVER be enabled here. It has no ECR image
    # override, so enabling it would render ghcr.io/nurfitrapujo/sentinel/
    # minio-init:0.1.0 (a registry with no imagePullSecrets on EKS, a tag that
    # exists nowhere, and a likely amd64-only image).
    enabled: false

# Legacy combined ingress renders nothing on AWS.
ingress:
  enabled: false

retentionCron:
  enabled: false

oncallCron:
  enabled: false

prometheusRule:
  enabled: false

dlqDrainer:
  enabled: false
  drainerEnabled: "false"
  drainerExecute: "false"
  persistence:
    enabled: false
    storageClass: "gp3"

serviceAccount:
  create: true
  name: ""
  annotations: {}
