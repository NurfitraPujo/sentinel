{{- if .Values.migrate.enabled }}
{{- $img := .Values.images.migrate -}}
{{- $tag := $img.tag | default .Chart.AppVersion -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sentinel.fullname" . }}-migrate
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run migrations before the app pods start, on every install and upgrade.
    # ArgoCD sync-wave (not a Helm hook): hooks run before plain manifests so
    # the Secret/bridge would not exist yet, and ArgoCD deletes hook resources
    # post-sync. Wave 1 runs after infra (wave -1/0) and gates app
    # Deployments (wave 2) — ArgoCD waits for the Job to Complete first.
    # Replace forces a fresh run whenever the rendered Job changes.
    # Force (delete+recreate, not in-place replace): Job spec.template is
    # immutable, so Replace=true fails on re-sync with "field is immutable".
    "argocd.argoproj.io/sync-wave": "1"
    "argocd.argoproj.io/sync-options": Force=true
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "sentinel.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sentinel.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ $img.repository }}:{{ $tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "sentinel.postgresEnv" . | nindent 12 }}
            - name: SSLMODE
              value: {{ .Values.config.postgres.sslmode | quote }}
            - name: DB_URL_PROCESSOR
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(SSLMODE)"
            - name: DB_URL_INGESTOR
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(SSLMODE)"
            - name: DB_URL_DASHBOARD
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(SSLMODE)"
          # The migrate image's entrypoint is `migrate`; run every requested target in order.
          # All targets share one physical database (A1) and each migration is idempotent.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- range .Values.migrate.targets }}
              echo ">> migrating target={{ . }}"
              migrate up -target={{ . }}
              {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}
