{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.dashboard.host | quote }}]
      secretName: {{ .Values.ingress.dashboard.tlsSecret }}
    - hosts: [{{ .Values.ingress.ingestor.host | quote }}]
      secretName: {{ .Values.ingress.ingestor.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.dashboard.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sentinel.fullname" . }}-dashboard
                port:
                  number: {{ .Values.dashboard.service.port }}
    - host: {{ .Values.ingress.ingestor.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sentinel.fullname" . }}-ingestor
                port:
                  number: {{ .Values.ingestor.service.port }}
{{- end }}
