{{- $secret := include "sentinel.secretName" . }}
{{- if .Values.init.nats.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sentinel.fullname" . }}-nats-init
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats-init
  annotations:
    # Create the JetStream streams before the app pods (wave 2) consume them.
    # ArgoCD sync-wave (not a Helm hook): ArgoCD strips Helm hooks, so the
    # streams were never created. Same wave as migrate-job (1).
    # Force (delete+recreate, not in-place replace): Job spec.template is
    # immutable, so Replace=true fails on re-sync with "field is immutable".
    "argocd.argoproj.io/sync-wave": "1"
    "argocd.argoproj.io/sync-options": Force=true
spec:
  backoffLimit: 5
  # Auto-remove the completed Job so the next release creates a fresh Job
  # instead of hitting Job spec.template immutability on re-apply.
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        {{- include "sentinel.labels" . | nindent 8 }}
        app.kubernetes.io/component: nats-init
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nats-init
          image: "{{ .Values.init.nats.image }}:{{ .Values.init.nats.tag | default .Chart.AppVersion }}"
          env:
            {{- if include "sentinel.natsUrlIsSecret" . }}
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.secretName" . }}
                  key: NATS_URL
            {{- else }}
            - name: NATS_URL
              value: {{ include "sentinel.natsUrl" . | quote }}
            {{- end }}
{{- end }}
{{- if .Values.init.minio.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sentinel.fullname" . }}-minio-init
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  # Match nats-init: auto-remove the completed Job on re-install/upgrade.
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        {{- include "sentinel.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio-init
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio-init
          image: "{{ .Values.init.minio.image }}:{{ .Values.init.minio.tag | default .Chart.AppVersion }}"
          env:
            - name: S3_ENDPOINT
              value: {{ include "sentinel.s3Endpoint" . | quote }}
            - name: S3_BUCKET
              value: {{ .Values.config.s3.bucket | quote }}
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: S3_SECRET_KEY } }
{{- end }}
