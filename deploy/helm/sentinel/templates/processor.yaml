{{- $img := .Values.images.processor -}}
{{- $tag := $img.tag | default .Chart.AppVersion -}}
{{- $secret := include "sentinel.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-processor
  annotations:
    # Start only after the migrate Job (wave 1) completes.
    "argocd.argoproj.io/sync-wave": "2"
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
spec:
  {{- if not .Values.processor.autoscaling.enabled }}
  replicas: {{ .Values.processor.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: processor
  template:
    metadata:
      labels:
        {{- include "sentinel.labels" . | nindent 8 }}
        app.kubernetes.io/component: processor
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.processor.healthPort | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sentinel.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: processor
          image: "{{ $img.repository }}:{{ $tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.processor.healthPort }}
          envFrom:
            - configMapRef:
                name: {{ include "sentinel.configMapName" . }}
          env:
            - name: PROCESSOR_HEALTH_ADDR
              value: ":{{ .Values.processor.healthPort }}"
            {{- include "sentinel.postgresEnv" . | nindent 12 }}
            {{- if include "sentinel.natsUrlIsSecret" . }}
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.secretName" . }}
                  key: NATS_URL
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: processor-go
            {{- include "sentinel.otelEnv" . | nindent 12 }}
            # sentinel-sourcemaps §12: the processor reads maps from the bucket the dashboard
            # writes them to (§4.4). S3_ENDPOINT/S3_BUCKET already arrive via the ConfigMap's
            # envFrom above; the two credentials are the same Secret keys dashboard.yaml mounts.
            # With SYMBOLICATE_PLATFORMS non-empty and these two absent, the processor
            # log.Fatalf's before it subscribes and CrashLoopBackOffs (decision 32) — the chart,
            # not an alert, is what keeps them together. RUNBOOK.md §2 renders this Deployment
            # and checks for both secretKeyRefs before a processor tag is cut.
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: S3_SECRET_KEY } }
            # The six symbolication knobs. Value syntax and meaning are documented beside each
            # key in values.yaml (config.processor.*); every one is a string on the wire.
            - name: SYMBOLICATE_PLATFORMS
              value: {{ .Values.config.processor.symbolicatePlatforms | quote }}
            - name: SOURCEMAP_CACHE_BYTES
              value: {{ .Values.config.processor.sourcemapCacheBytes | quote }}
            - name: SOURCEMAP_NEGATIVE_TTL
              value: {{ .Values.config.processor.sourcemapNegativeTtl | quote }}
            - name: SOURCEMAP_POSITIVE_TTL
              value: {{ .Values.config.processor.sourcemapPositiveTtl | quote }}
            - name: SYMBOLICATE_DEADLINE
              value: {{ .Values.config.processor.symbolicateDeadline | quote }}
            - name: SOURCEMAP_MAX_PARSE_BYTES
              value: {{ .Values.config.processor.sourcemapMaxParseBytes | quote }}
            # sentinel-span-ingest D2/D3: the SPANS consumer and the core-trace pull (values.yaml `spans:`). A
            # malformed SPAN_PULL value stops the process at start; empty = that half is off.
            - name: SPAN_INGEST_ENABLED
              value: {{ .Values.spans.enabled | quote }}
            - name: SPAN_PULL_SCOPES
              value: {{ .Values.spans.pull.scopes | quote }}
            - name: TRACE_STORE_KIND
              value: {{ .Values.spans.pull.storeKind | quote }}
            - name: TRACE_STORE_URL
              value: {{ .Values.spans.pull.storeUrl | quote }}
            # Go runtime soft memory limit, below resources.limits.memory (decision 35) so the
            # collector runs before the kernel's OOM killer does; see processor.gomemlimit in
            # values.yaml for the arithmetic that derives it.
            - name: GOMEMLIMIT
              value: {{ .Values.processor.gomemlimit | quote }}
          livenessProbe:
            httpGet: { path: {{ .Values.processor.livenessPath }}, port: health }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: {{ .Values.processor.readinessPath }}, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.processor.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}-processor
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
spec:
  type: {{ .Values.processor.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: processor
  ports:
    - name: health
      port: {{ .Values.processor.service.port }}
      targetPort: health
{{- if .Values.processor.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sentinel.fullname" . }}-processor
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
  annotations:
    # Wave 3: attach only after the Deployment (wave 2) exists. Creating the
    # HPA in wave 0 on a fresh install makes the HPA controller report
    # "unable to get the target's current scale" (health Degraded), which
    # aborts the whole ArgoCD sync before migrations (wave 1) ever run.
    "argocd.argoproj.io/sync-wave": "3"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sentinel.fullname" . }}-processor
  minReplicas: {{ .Values.processor.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.processor.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.processor.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.processor.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sentinel.fullname" . }}-processor
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
  annotations:
    # Wave 3: PDB selects Deployment pods (wave 2); keep it with the HPA so a
    # fresh install never evaluates budgets against missing workloads.
    "argocd.argoproj.io/sync-wave": "3"
spec:
  minAvailable: {{ .Values.processor.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: processor
{{- end }}
