{{- if eq (include "sentinel.isAws" .) "true" }}
# AWS EKS path: ExternalSecret synced from SSM Parameter Store via ESO.
# Successor to the Huawei SealedSecret: no ciphertext in git, no in-chart
# plaintext. Every key is pinned explicitly via .Values.externalSecrets.secrets
# (ENV_VAR -> full SSM path). A bulk dataFrom.find is deliberately NOT used:
# on this ESO version it flattens each parameter under its full path (and
# walks nested sub-paths) instead of the leaf key, which would inject bogus
# env vars into every consumer (see cloud-migration.todo.md §4.5.2 pitfalls).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sentinel.secretName" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
  annotations:
    # Must sync before any workload that mounts the Secret (ArgoCD wave).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ include "sentinel.externalSecretsRefreshInterval" . | quote }}
  secretStoreRef:
    name: {{ include "sentinel.secretStore" . }}
    kind: ClusterSecretStore
  target:
    name: {{ include "sentinel.secretName" . }}
    creationPolicy: Owner
  {{- $ext := .Values.externalSecrets | default dict }}
  {{- if not $ext.secrets }}
  {{- fail "externalSecrets.secrets must map ENV_VAR -> full SSM path when global.provider=aws" }}
  {{- end }}
  data:
    {{- range $secretKey, $remoteKey := $ext.secrets }}
    {{- if not (hasPrefix "/" $remoteKey) }}
    {{- fail (printf "externalSecrets.secrets[%s] must be a full SSM path starting with /" $secretKey) }}
    {{- end }}
    - secretKey: {{ $secretKey | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
{{- else if not .Values.secrets.existingSecret }}
{{- if eq (.Values.secrets.backend | default "plain") "sealed" }}
# Huawei CCE path: kubeseal-encryptor SealedSecret. Ciphertexts live in
# `.Values.secrets.sealedData` — seal via the kubeseal-encryptor API scoped to
# the release namespace, then paste the ciphertext here. See RUNBOOK.md.
# NOTE: no metadata.labels and no spec.template — kubeseal-encrypt-string
# output is scope-bound (name+namespace) and the controller rejects template
# metadata it did not seal. Mirrors cdc-pipeline's shared-secrets.yaml.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "sentinel.secretName" . }}
spec:
  encryptedData:
    {{- range $k, $v := .Values.secrets.sealedData }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
{{- else if .Values.secrets.create }}
# Demo/generic path: plain in-chart Secret. Never use with production values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.secretName" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
