{{- if .Values.retentionCron.enabled }}
{{- $secret := include "sentinel.secretName" . -}}
# N9 (docs/plans/AGENT_WORKER_PLAN.md, contract correction C11): schedules POST /api/cron/retention.
# Where the compose stack wraps a curl in a sleep-loop (a container has no external scheduler), Kubernetes
# has a first-class CronJob primitive, so this uses it directly rather than a long-running sleep-loop pod.
# Each run is a short curlimages/curl Job that POSTs the in-cluster dashboard Service with the shared
# CRON_SECRET (read from the existing chart Secret, same key the dashboard Deployment consumes).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sentinel.fullname" . }}-retention
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: retention-cron
spec:
  schedule: {{ .Values.retentionCron.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.retentionCron.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.retentionCron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.retentionCron.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.retentionCron.backoffLimit }}
      # HOW LONG A FINISHED JOB LINGERS (report-an-issue/BUG-89).
      #
      # failedJobsHistoryLimit caps how MANY failed Jobs are kept and says nothing
      # about how OLD they get, while KubeJobFailed fires on the existence of a
      # Failed Job with no time bound. This cron's own failures from 2026-10-01
      # were still firing that alert two and a half days later, with the newest
      # runs completing in four seconds -- so the alert described a fixed problem.
      #
      # A day: long enough to read a failure the next morning, short enough that
      # the alert resolves itself.
      ttlSecondsAfterFinished: {{ .Values.retentionCron.ttlSecondsAfterFinished | default 86400 }}
      activeDeadlineSeconds: {{ .Values.retentionCron.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "sentinel.labels" . | nindent 12 }}
            app.kubernetes.io/component: retention-cron
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "sentinel.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.affinity }}
          affinity: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations: {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: retention-cron
              image: "{{ .Values.retentionCron.image.repository }}:{{ .Values.retentionCron.image.tag }}"
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: CRON_SECRET
              command: ["/bin/sh", "-c"]
              args:
                # -sS quiet-but-loud-on-error, -f so a non-2xx fails the Job (backoffLimit retries),
                # --max-time bounds a hung dashboard. The in-cluster Service DNS name never leaves the
                # cluster, so the secret header is not exposed on any external hop.
                - >-
                  curl -sS -f --max-time {{ .Values.retentionCron.timeoutSeconds }}
                  -X POST
                  -H "x-cron-secret: ${CRON_SECRET}"
                  {{ include "sentinel.fullname" . }}-dashboard:{{ .Values.dashboard.service.port }}/api/cron/retention
              resources:
                {{- toYaml .Values.retentionCron.resources | nindent 16 }}
{{- end }}
