# values.aws.staging.yml — AWS EKS staging values (dual-cloud chart).
# Ported from values-huawei-staging.yml (Huawei CCE). Conventions vs CCE:
#   - global.provider=aws switches templates/secret.yaml to an ExternalSecret
#     (SSM Parameter Store via ESO) and gates off the CCE Ingresses +
#     externalServices Endpoints. No ciphertext in git, no in-chart plaintext.
#   - ENV_VAR -> full SSM path map under externalSecrets.secrets; seed each
#     path as SecureString (/tuju/staging/sentinel/shared/<KEY>). Pinned
#     explicitly — no bulk dataFrom.find — to avoid the ESO path-flattening
#     trap (see cloud-migration.todo.md §4.5.2).
#   - Services are ClusterIP-only; edge routing is Emissary (infra repo owns
#     Hosts + Mappings: sentinel.staging.tuju.ai -> dashboard, and
#     api-sentinel.staging.tuju.ai -> ingestor). Wildcard Host *.staging.tuju.ai
#     already covers both names, so no Host change is needed.
#   - No imagePullSecrets on EKS (same-account ECR via node instance role).
#   - Canonical staging host: sentinel.staging.tuju.ai (mirrors Huawei
#     sentinel-stg.daya.ai).
#
# STAGING CUTOVER — LIVE as of 2026-09-27 (tracker §3.8 / 2.11f).
# Preconditions verified before flipping to live:
#   1. sentinel-staging restored from Huawei RDS on the migration host
#      (10.254.0.20): 50/50 tables, all row counts identical to source, the 3
#      sequences carry the same last_value, ANALYZE run, 11 MB both sides.
#      Ownership + grants handed to tuju-sentinel-user (--no-owner left every
#      object owned by tuju-migration-user).
#   2. CCE sentinel-staging drained to 0 and its ArgoCD app self-heal disabled
#      (otherwise it reverts the scale and keeps writing to Huawei).
#   3. All 4 JetStream streams (ERROR_EVENTS, ERROR_EVENTS_DLQ, API_KEYS,
#      ALERT_CONFIG) and their consumers already restored by the §5 NATS cutover.
#   4. Images in ECR via the dual-push release workflow (2.11u).
#
# What is deliberately still off, and why:
#   init.nats.enabled=false — the streams and consumers already exist from the
#     NATS cutover, and scripts/nats-init.sh is NOT idempotent for consumers:
#     it calls `nats consumer add` with no existence guard under `set -e`, so an
#     existing `processor-consumer` makes the Job exit non-zero. It is a wave-1
#     `Sync` hook, so that failure would block the whole deploy. Verified live:
#     `nats consumer ls ERROR_EVENTS` -> processor-consumer (2026-09-21).
#   dlqDrainer.enabled=false — its jobTemplate hardcodes replicas: 1 and its
#     cursor lives on a PVC; enabling it needs a StorageClass decision first.
#   autoscaling.enabled=false / podDisruptionBudget.enabled=false — one replica
#     each, and a PDB with minAvailable: 1 on a single replica would block every
#     voluntary disruption (spot node drains, cluster-autoscaler).
#   init.minio.enabled=false — S3/OBS is in use, no MinIO.
#
# Image tags: pinned to a released tag; the release workflow injects the live
# one at deploy time via `images.*.tag` helm parameters.

global:
  provider: aws
  environment: staging
  org: tuju
  repoName: sentinel

environment: staging

# CCE-only: manual Endpoints for Huawei private IPs. Empty on AWS (VPC DNS).
externalServices: []

# Cross-component secrets -> k8s Secret sentinel-sentinel-secrets (ExternalSecret).
externalSecrets:
  enabled: true
  storeName: aws-parameter-store
  secrets:
    POSTGRES_PASSWORD: "/tuju/staging/sentinel/shared/POSTGRES_PASSWORD"
    REDIS_PASSWORD: "/tuju/staging/sentinel/shared/REDIS_PASSWORD"
    NATS_URL: "/tuju/staging/sentinel/shared/NATS_URL"
    AUTH_SECRET: "/tuju/staging/sentinel/shared/AUTH_SECRET"
    CRON_SECRET: "/tuju/staging/sentinel/shared/CRON_SECRET"
    EMAIL_SERVER: "/tuju/staging/sentinel/shared/EMAIL_SERVER"
    SENTINEL_ENCRYPTION_KEY: "/tuju/staging/sentinel/shared/SENTINEL_ENCRYPTION_KEY"
    SETTINGS_ENCRYPTION_KEY: "/tuju/staging/sentinel/shared/SETTINGS_ENCRYPTION_KEY"
    S3_ACCESS_KEY: "/tuju/staging/sentinel/shared/S3_ACCESS_KEY"
    S3_SECRET_KEY: "/tuju/staging/sentinel/shared/S3_SECRET_KEY"

# -----------------------------------------------------------------------------
# First-party images (ECR, tuju prod account 576329195570, ap-southeast-1).
# tags are pinned by CI at deploy time; empty => Chart.AppVersion. Nothing is
# pulled while replicas are 0, so an absent tag is inert until cutover.
# -----------------------------------------------------------------------------
images:
  ingestor:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-ingestor
    tag: ""
  processor:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-processor
    tag: ""
  dashboard:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-dashboard
    tag: ""
  migrate:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-db-migrate
    tag: ""
  dlqDrainer:
    repository: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-dlq-drainer
    tag: ""

imagePullPolicy: IfNotPresent
imagePullSecrets: []

nodeSelector:
  EKSNodeGroupType: medium-size-x86-64-spot
affinity: {}
tolerations: []

config:
  postgres:
    host: rds.staging.internal.tuju.ai
    port: 5432
    user: tuju-sentinel-user
    database: sentinel-staging
    # rds.force_ssl=0 on the AWS parameter group (matches core/webhook).
    sslmode: disable
  nats:
    # Authenticated DSN arrives via the Secret (NATS_URL) — see the helper.
    url: ""
  redis:
    addr: "redis.staging.internal.tuju.ai:6379"
    # Dedicated index: AWS cache DB0=core, DB1=core-jobs+webhook, DB2=webhook-jobs.
    # Sentinel only caches API-key lookups + rate-limit counters (ephemeral), so
    # a fresh index is safe and avoids key collisions.
    db: "3"
  s3:
    # Huawei OBS retained during the migration window (mirrors core's OBS_* dual
    # run). NOTE: the staging CCE S3_SECRET_KEY is the literal placeholder
    # "S3_SECRET_KEY" (byte-copied), so attachment uploads/presign will fail
    # until a real key is supplied — pre-existing on CCE, tracked as a follow-up.
    endpoint: "https://obs.ap-southeast-3.myhuaweicloud.com"
    publicEndpoint: "https://obs.ap-southeast-3.myhuaweicloud.com"
    bucket: sentinel-staging
  otel:
    exporterEndpoint: ""
  dashboard:
    authUrl: "https://sentinel.staging.tuju.ai"
    authTrustHost: "true"
    # Kept on daya.ai for now (verified SES identity); rebrand at cutover.
    emailFrom: "noreply@daya.ai"
    dataRetentionDays: "30"
    reportMatchWindowMinutes: "30"
    escalationAckMinutes: "15"
    escalationMaxHops: "3"
    reportUploadRpm: "10"
    reportUploadBytesPerDay: "262144000"
    claimStaleHours: "24"
    manualIssueRetentionDays: "365"
  ingestor:
    ratelimitStrictMode: "true"

# Live: run the db-migrate Job (a wave-1 `Sync` hook) so the restored schema is
# reconciled with the app's expectations. The database is populated, so unlike
# the dormant phase this is safe to run.
migrate:
  enabled: true
  targets:
    - processor
    - ingestor
    - dashboard

ingestor:
  replicaCount: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  ingress:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

processor:
  replicaCount: 1
  healthPort: 8081
  service:
    type: ClusterIP
    port: 8081
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

dashboard:
  replicaCount: 1
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
    nodePort: null
  ingress:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

# Bundled stateful deps: all OFF — managed/shared equivalents above.
dependencies:
  postgres:
    enabled: false
  nats:
    enabled: false
  redis:
    enabled: false
  minio:
    enabled: false

# init.nats stays OFF even though we are live: the §5 NATS cutover already
# restored the streams AND their consumers, and scripts/nats-init.sh would fail
# on `nats consumer add` for the existing processor-consumer. See the header.
init:
  nats:
    enabled: false
    image: 576329195570.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-nats-init
    tag: ""
  minio:
    enabled: false

# Legacy combined ingress renders nothing on AWS.
ingress:
  enabled: false

retentionCron:
  enabled: true

oncallCron:
  enabled: true

prometheusRule:
  enabled: false

dlqDrainer:
  enabled: false
  drainerEnabled: "false"
  drainerExecute: "false"
  persistence:
    enabled: false
    storageClass: "gp3"

serviceAccount:
  create: true
  name: ""
  annotations: {}
