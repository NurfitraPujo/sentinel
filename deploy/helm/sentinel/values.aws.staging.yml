# values.aws.staging.yml — AWS EKS staging values (dual-cloud chart).
# Ported from values-k8s-staging.yml (K8s CCE). Conventions vs CCE:
#   - global.provider=aws switches templates/secret.yaml to an ExternalSecret
#     (SSM Parameter Store via ESO) and gates off the CCE Ingresses +
#     externalServices Endpoints. No ciphertext in git, no in-chart plaintext.
#   - ENV_VAR -> full SSM path map under externalSecrets.secrets; seed each
#     path as SecureString (/example/staging/sentinel/shared/<KEY>). Pinned
#     explicitly — no bulk dataFrom.find — to avoid the ESO path-flattening
#     trap (see cloud-migration.todo.md §4.5.2).
#   - Services are ClusterIP-only; edge routing is Emissary (infra repo owns
#     Hosts + Mappings: sentinel.staging.example.com -> dashboard, and
#     api-sentinel.staging.example.com -> ingestor). Wildcard Host *.staging.example.com
#     already covers both names, so no Host change is needed.
#   - No imagePullSecrets on EKS (same-account ECR via node instance role).
#   - Canonical staging host: sentinel.staging.example.com (mirrors K8s
#     sentinel-stg.example.com).
#
# STAGING CUTOVER — LIVE as of 2026-09-27 (tracker §3.8 / 2.11f).
# Preconditions verified before flipping to live:
#   1. sentinel-staging restored from K8s RDS on the migration host
#      (10.254.0.20): 50/50 tables, all row counts identical to source, the 3
#      sequences carry the same last_value, ANALYZE run, 11 MB both sides.
#      Ownership + grants handed to example-sentinel-user (--no-owner left every
#      object owned by example-migration-user).
#   2. CCE sentinel-staging drained to 0 and its ArgoCD app self-heal disabled
#      (otherwise it reverts the scale and keeps writing to K8s).
#   3. All 4 JetStream streams (ERROR_EVENTS, ERROR_EVENTS_DLQ, API_KEYS,
#      ALERT_CONFIG) and their consumers already restored by the §5 NATS cutover.
#   4. Images in ECR via the dual-push release workflow (2.11u).
#
# What is deliberately still off, and why:
#   init.nats.enabled=false — the streams and consumers already exist from the
#     NATS cutover, so there is nothing for the init Job to do. scripts/
#     nats-init.sh IS idempotent since 2026-10-01 (consumer_exists() +
#     create_consumer_if_missing() guard all three `nats consumer add` calls,
#     mirroring the stream_exists() guard), so re-enabling it is safe — it just
#     converges streams in place and skips existing consumers. Left off because
#     a no-op wave-1 `Sync` hook still costs a Job run on every sync for zero
#     effect. Verified live: `nats consumer ls ERROR_EVENTS` ->
#     processor-consumer (2026-09-21).
#   dlqDrainer.enabled=false — its jobTemplate hardcodes replicas: 1 and its
#     cursor lives on a PVC; enabling it needs a StorageClass decision first.
#   autoscaling.enabled=false / podDisruptionBudget.enabled=false — one replica
#     each, and a PDB with minAvailable: 1 on a single replica would block every
#     voluntary disruption (spot node drains, cluster-autoscaler).
#   init.minio.enabled=false — S3/OBS is in use, no MinIO.
#
# Image tags: pinned to the released tag. This is a DECLARATIVE fallback — the
# release workflow injects the live one at deploy time via `images.*.tag` helm
# parameters, so a new release overrides these without a chart edit. It is
# pinned rather than left empty because `""` falls back to `Chart.AppVersion`
# (`0.1.0`), which exists in no registry: the migrate Job then sits in
# ImagePullBackOff and, being a wave-1 `Sync` hook, blocks every sync until
# someone notices. Verified live in ECR at 2026-09-27.

global:
  provider: aws
  environment: staging
  org: example
  repoName: sentinel

environment: staging

# CCE-only: manual Endpoints for K8s private IPs. Empty on AWS (VPC DNS).
externalServices: []

# Cross-component secrets -> k8s Secret sentinel-sentinel-secrets (ExternalSecret).
externalSecrets:
  enabled: true
  storeName: aws-parameter-store
  secrets:
    POSTGRES_PASSWORD: "/example/staging/sentinel/shared/POSTGRES_PASSWORD"
    # The owning role's password, for the migration job only -- see migrate.postgres.
    # Lives under /rds/ rather than /sentinel/ because the role is shared across
    # this RDS instance's databases, not owned by sentinel.
    MIGRATE_POSTGRES_PASSWORD: "/example/staging/rds/example-migration-user/password"
    REDIS_PASSWORD: "/example/staging/sentinel/shared/REDIS_PASSWORD"
    NATS_URL: "/example/staging/sentinel/shared/NATS_URL"
    AUTH_SECRET: "/example/staging/sentinel/shared/AUTH_SECRET"
    CRON_SECRET: "/example/staging/sentinel/shared/CRON_SECRET"
    EMAIL_SERVER: "/example/staging/sentinel/shared/EMAIL_SERVER"
    SENTINEL_ENCRYPTION_KEY: "/example/staging/sentinel/shared/SENTINEL_ENCRYPTION_KEY"
    SETTINGS_ENCRYPTION_KEY: "/example/staging/sentinel/shared/SETTINGS_ENCRYPTION_KEY"
    S3_ACCESS_KEY: "/example/staging/sentinel/shared/S3_ACCESS_KEY"
    S3_SECRET_KEY: "/example/staging/sentinel/shared/S3_SECRET_KEY"
    GITHUB_CLIENT_ID: "/example/staging/sentinel/shared/GITHUB_CLIENT_ID"
    GITHUB_CLIENT_SECRET: "/example/staging/sentinel/shared/GITHUB_CLIENT_SECRET"
    # D4 / D20 (TASK-03 creates both SSM parameters before the PodMonitor's insights entry or the Databend sections work).
    DATABEND_PASSWORD: "/example/staging/sentinel/shared/DATABEND_PASSWORD"
    METRICS_SCRAPE_TOKEN: "/example/staging/sentinel/shared/METRICS_SCRAPE_TOKEN"

# -----------------------------------------------------------------------------
# First-party images (ECR, example prod account 123456789012, ap-southeast-1).
# tags are pinned by CI at deploy time; empty => Chart.AppVersion. Nothing is
# pulled while replicas are 0, so an absent tag is inert until cutover.
# -----------------------------------------------------------------------------
images:
  ingestor:
    repository: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-ingestor
    tag: "v0.2.40-staging"
  processor:
    repository: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-processor
    tag: "v0.2.40-staging"
  dashboard:
    repository: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-dashboard
    tag: "v0.2.40-staging"
  migrate:
    repository: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-db-migrate
    tag: "v0.2.40-staging"
  dlqDrainer:
    repository: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-dlq-drainer
    tag: "v0.2.40-staging"

imagePullPolicy: IfNotPresent
imagePullSecrets: []

# EKSNodeGroupType selects the x86-64 spot pool (verified live on both
# clusters); kubernetes.io/arch+os are kubelet-guaranteed belt-and-braces so a
# drifted custom label can never reschedule amd64-only images onto Graviton.
nodeSelector:
  EKSNodeGroupType: medium-size-x86-64-spot
  kubernetes.io/arch: amd64
  kubernetes.io/os: linux
affinity: {}
tolerations: []

config:
  postgres:
    host: rds.staging.internal.example.com
    port: 5432
    user: example-sentinel-user
    database: sentinel-staging
    # rds.force_ssl=0 on the AWS parameter group (matches core/webhook).
    sslmode: disable
  nats:
    # Authenticated DSN arrives via the Secret (NATS_URL) — see the helper.
    url: ""
  redis:
    addr: "redis.staging.internal.example.com:6379"
    # Dedicated index: AWS cache DB0=core, DB1=core-jobs+webhook, DB2=webhook-jobs.
    # Sentinel only caches API-key lookups + rate-limit counters (ephemeral), so
    # a fresh index is safe and avoids key collisions.
    db: "3"
  s3:
    # K8s OBS retained during the migration window (mirrors core's OBS_* dual
    # run). NOTE: the staging CCE S3_SECRET_KEY is the literal placeholder
    # "S3_SECRET_KEY" (byte-copied), so attachment uploads/presign will fail
    # until a real key is supplied — pre-existing on CCE, tracked as a follow-up.
    endpoint: "https://obs.example.com"
    publicEndpoint: "https://obs.example.com"
    bucket: sentinel-staging
  otel:
    exporterEndpoint: ""
  dashboard:
    authUrl: "https://sentinel.staging.example.com"
    cliProfile: "staging"
    # Client IP behind AWS ALB -> Emissary/Envoy -> dashboard. The ALB appends the client's address to
    # X-Forwarded-For; Envoy (default use_remote_address, xff_num_trusted_hops 0) then appends ITS peer, the ALB.
    # So the header ends "<client>, <alb>" and the client is the 2nd entry from the right: xffDepth 2. Depth counts
    # from the right, so a client-forged X-Forwarded-For prefix is never picked. Re-verify after any proxy change
    # (log getClientAddress() for a known IP); a too-large depth falls back to the TCP peer, not an error.
    clientIp:
      addressHeader: "x-forwarded-for"
      xffDepth: "2"
    authTrustHost: "true"
    # Kept on example.ai for now (verified SES identity); rebrand at cutover.
    emailFrom: "noreply@example.ai"
    dataRetentionDays: "30"
    reportMatchWindowMinutes: "30"
    escalationAckMinutes: "15"
    escalationMaxHops: "3"
    reportUploadRpm: "10"
    reportUploadBytesPerDay: "262144000"
    claimStaleHours: "24"
    manualIssueRetentionDays: "365"
  ingestor:
    ratelimitStrictMode: "true"
    # sentinel-sentry-compat-ingest (contract D15): empty = fail closed -- the relay's X-Forwarded-For and
    # X-Sentinel-Relay-* headers are ignored. core-sentinel-mobile-relay sets this at its rollout, by the
    # RUNBOOK entry "Sentry-compatible ingest: trusting core's relay". Narrowest CIDR only.
    sentryCompatTrustedProxyCidrs: []

# Live: run the db-migrate Job (a wave-1 `Sync` hook) so the restored schema is
# reconciled with the app's expectations. The database is populated, so unlike
# the dormant phase this is safe to run.
migrate:
  enabled: true
  targets:
    - processor
    - ingestor
    - dashboard
  # STAGING'S SCHEMA IS OWNED BY example-migration-user, NOT BY THE APP ROLE.
  #
  # Measured, not assumed: all 50 tables in public are owned by
  # example-migration-user while the app connects as example-sentinel-user, so every
  # ALTER TABLE in a migration failed with "must be owner of table" and froze
  # the Argo sync from 2026-09-30 (report-an-issue/BUG-68). Production is the
  # other way round -- example-sentinel-user owns 56 of its 57 tables -- so this
  # override is staging-only, deliberately.
  #
  # Safe for the app: ALTER DEFAULT PRIVILEGES FOR example-migration-user already
  # grants example-sentinel-user arwdDxt on new tables, rwU on sequences and X on
  # functions, so anything the migrations create from here is readable and
  # writable by the running pods without a further grant.
  postgres:
    user: example-migration-user
    passwordSecretKey: MIGRATE_POSTGRES_PASSWORD

ingestor:
  replicaCount: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  ingress:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

processor:
  replicaCount: 1
  healthPort: 8081
  service:
    type: ClusterIP
    port: 8081
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

dashboard:
  replicaCount: 1
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
    nodePort: null
  ingress:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

# Bundled stateful deps: all OFF — managed/shared equivalents above.
dependencies:
  postgres:
    enabled: false
  nats:
    enabled: false
  redis:
    enabled: false
  minio:
    enabled: false

# init.nats stays OFF even though we are live: the §5 NATS cutover already
# restored the streams AND their consumers. scripts/nats-init.sh has been
# idempotent since 2026-10-01 (consumer_exists guard), so enabling it would be
# safe but pointless — see the header.
# sentinel-span-ingest: AWS reads VictoriaTraces' Jaeger query API (no auth, reachable from the VPC). Off while this
# environment is parked (replicas 0, the NATS cutover owns the streams): at cutover create SPANS / SPANS_DLQ /
# processor-spans exactly as scripts/nats-init.sh does, set enabled, and fill scopes with `<example org uuid>:<core project uuid>`.
spans:
  enabled: false
  pull:
    scopes: ""
    storeKind: jaeger
    storeUrl: http://monitoring.internal.example.com:10428

init:
  nats:
    enabled: false
    image: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/sentinel-nats-init
    tag: "v0.2.40-staging"
    # Staging NATS caps each server's JetStream file store at 18GiB (infra
    # k8s/clusters/example-staging/platform/nats/values.yaml) and reserves MaxBytes
    # up front, so the 10GiB / 1GiB defaults crowded out other streams
    # (media_jobs could not be placed). Staging holds a few MB of errors. While
    # this job is off nothing applies these sizes: edit the live streams to
    # match with `nats stream edit --max-bytes`. They apply if it is enabled.
    errorEvents:
      maxBytes: "2GiB"
    errorEventsDlq:
      maxBytes: "256MiB"
  minio:
    enabled: false

# Legacy combined ingress renders nothing on AWS.
ingress:
  enabled: false

retentionCron:
  enabled: true
  # Paced from hourly to every 15 minutes to distribute occurrence deletion
  # across smaller, smoother batches and prevent CDC replication slot lag spikes.
  schedule: "*/15 * * * *"

oncallCron:
  enabled: true

# sentinel-reporting-and-dashboard D6/D7/D8: SLI collection from VictoriaMetrics, the SLI set, Databend analytics and
# the PodMonitors. serviceSlis is the starting set from the contract (operator, 2026-10-07).
sliCollectCron:
  enabled: true

podMonitor:
  enabled: true

analytics:
  victoriaMetricsUrl: "http://monitoring.internal.example.com:8428"
  sliCluster: "example-staging"
  databend:
    url: "http://databend-query.databend.svc.cluster.local:8000"
    user: sentinel_app
    database: sentinel

serviceSlis:
  - id: core-api
    kind: http
    project: core
    source: api_core_80
    # SSE routes get their own Envoy cluster (infra cluster_tag: sse): latency reads `source` only, availability reads both.
    streamSource: api_core_80_sse
    availabilityTarget: 0.995
    latency: { le: "1000.0", target: 0.94 }
    service: api
    windowDays: 28
  - id: web
    kind: http
    project: web
    source: web_web_80
    availabilityTarget: 0.995
    latency: { le: "1000.0", target: 0.95 }
    windowDays: 28
  - id: core-jobs
    kind: jobs
    project: core
    source: example_core_job_handler_runs_total
    availabilityTarget: 0.995
    windowDays: 28
  - id: core-nats
    kind: nats
    project: core
    source: example_core_nats_handler_runs_total
    availabilityTarget: 0.995
    windowDays: 28

prometheusRule:
  enabled: false

dlqDrainer:
  enabled: false
  drainerEnabled: "false"
  drainerExecute: "false"
  persistence:
    enabled: false
    storageClass: "gp3"

serviceAccount:
  create: true
  name: ""
  annotations: {}
