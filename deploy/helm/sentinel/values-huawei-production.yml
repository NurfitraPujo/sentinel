# Huawei CCE production values for the Sentinel chart.
#
# Fill every PLACEHOLDER before installing:
#   - sealedData: paste kubeseal-encryptor ciphertext scoped to the
#     sentinel-production namespace (see RUNBOOK.md). Never commit plaintext.
#   - externalServices IPs: managed RDS / DCS Redis private IPs (10.200.x.x).
#   - S3_* : OBS endpoint / bucket / browser-reachable public endpoint.
#   - elbId / tlsCertIds: reuse cdc's shared internal ELB unless the platform
#     team provisions a Sentinel-specific one.
#
# Render check (no cluster needed):
#   helm template sentinel . -f values-huawei-production.yml

global:
  provider: huawei

imagePullPolicy: IfNotPresent
imagePullSecrets:
  - name: default-secret

nodeSelector:
  node_type: spot

# -----------------------------------------------------------------------------
# First-party images. All built from this repo and pushed to SWR
# (swr.ap-southeast-3.myhuaweicloud.com/daya-engineering). Tags default to
# Chart.AppVersion; the release workflows --set image.tag to the git tag.
# -----------------------------------------------------------------------------
images:
  ingestor:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-ingestor
    tag: ""
  processor:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-processor
    tag: ""
  dashboard:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-dashboard
    tag: ""
  migrate:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-db-migrate
    tag: ""
  dlqDrainer:
    repository: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-dlq-drainer
    tag: ""

secrets:
  create: false
  existingSecret: ""
  backend: sealed
  # kubeseal-encryptor ciphertext, scope: namespace sentinel-production.
  # Replace every PLACEHOLDER via the encryptor API before installing.
  sealedData:
    POSTGRES_PASSWORD: ""
    REDIS_PASSWORD: ""
    S3_ACCESS_KEY: ""
    S3_SECRET_KEY: ""
    AUTH_SECRET: ""
    SETTINGS_ENCRYPTION_KEY: ""
    SENTINEL_ENCRYPTION_KEY: ""
    CRON_SECRET: ""
    EMAIL_SERVER: ""
    # Shared-cluster NATS DSN (with credentials) — seal via kubeseal-encrypt-string
    # scoped to namespace sentinel-production, name sentinel-sentinel-secrets.
    NATS_URL: ""

# -----------------------------------------------------------------------------
# Managed VPC endpoints. CCE Standard cannot route pod traffic to these IPs
# directly, so each entry also renders a selector-less Service + Endpoints
# (templates/external-services.yaml) that apps dial by in-cluster DNS name.
# -----------------------------------------------------------------------------
externalServices:
  - name: rds-postgres-sentinel
    ip: 10.200.53.141
    port: 5432
  - name: dcs-redis-sentinel
    ip: 10.200.60.184
    port: 6379

config:
  postgres:
    host: rds-postgres-sentinel
    port: 5432
    user: sentinel-user
    database: sentinel-production
    sslmode: require
  nats:
    # Shared cluster NATS (authenticated DSN sealed as NATS_URL) — bundled off.
    url: ""
  redis:
    addr: "dcs-redis-sentinel:6379"
    # DB 1: the shared DCS instance also serves cdc-pipeline on DB 0 —
    # a dedicated index avoids key collisions. Confirm index 1 is free.
    db: 1
  s3:
    endpoint: "https://obs.ap-southeast-3.myhuaweicloud.com"
    publicEndpoint: "https://obs.ap-southeast-3.myhuaweicloud.com"
    bucket: sentinel-production
  otel:
    exporterEndpoint: ""
  dashboard:
    authUrl: "https://sentinel.daya.ai"
    authTrustHost: "true"
    emailFrom: "noreply@daya.ai"
    dataRetentionDays: "30"
    reportMatchWindowMinutes: "30"
    escalationAckMinutes: "15"
    escalationMaxHops: "3"
    reportUploadRpm: "10"
    reportUploadBytesPerDay: "262144000"
    claimStaleHours: "24"
    manualIssueRetentionDays: "365"
  ingestor:
    ratelimitStrictMode: "true"

migrate:
  enabled: true
  targets:
    - processor
    - ingestor
    - dashboard

ingestor:
  replicaCount: 2
  containerPort: 8080
  service:
    type: NodePort
    port: 8080
    nodePort: 31316
  ingress:
    enabled: true
    host: api-sentinel.daya.ai
    elbId: 99ed1830-9f66-4ba4-84e2-3d1b819eaf55
    tlsCertIds: ef8353e34fcd412699b149970aca8995,ef8353e34fcd412699b149970aca8995
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

processor:
  replicaCount: 2
  healthPort: 8081
  service:
    type: ClusterIP
    port: 8081
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

dashboard:
  replicaCount: 2
  containerPort: 3000
  service:
    type: NodePort
    port: 3000
    nodePort: 31317
  ingress:
    enabled: true
    host: sentinel.daya.ai
    elbId: 99ed1830-9f66-4ba4-84e2-3d1b819eaf55
    tlsCertIds: ef8353e34fcd412699b149970aca8995,ef8353e34fcd412699b149970aca8995
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

# Bundled stateful deps: all OFF on Huawei — managed/shared equivalents above.
dependencies:
  postgres:
    enabled: false
  nats:
    enabled: false
  redis:
    enabled: false
  minio:
    enabled: false

init:
  nats:
    enabled: true
    image: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-nats-init
    tag: ""
  minio:
    enabled: false
    image: swr.ap-southeast-3.myhuaweicloud.com/daya-engineering/sentinel-minio-init
    tag: ""

# Legacy combined ingress renders nothing when provider == huawei.
ingress:
  enabled: false

retentionCron:
  enabled: true
  schedule: "0 * * * *"

oncallCron:
  enabled: false

prometheusRule:
  enabled: false

dlqDrainer:
  enabled: true
  drainerEnabled: "false"
  drainerExecute: "false"

serviceAccount:
  create: true
  name: ""
  annotations: {}
