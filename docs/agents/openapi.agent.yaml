                      type: object
                      properties:
                        seq:
                          type: number
                        eventType:
                          type: string
                          enum:
                            - status_changed
                            - assigned
                            - unassigned
                            - regressed
                            - ai_analysis
                            - linked
                            - commented
                            - claimed
                            - claim_released
                            - progress_update
                            - question_asked
                            - question_answered
                            - moved
                            - attachment_added
                            - report_edited
                            - report_created
                            - created
                            - occurrence_burst
                        actorType:
                          type: string
                          enum:
                            - user
                            - agent
                            - system
                        actorId:
                          type: string
                        oldValue: {}
                        newValue: {}
                        createdAt:
                          type:
                            - string
                            - "null"
                          format: date-time
                        issue:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            status:
                              type: string
                            issueType:
                              type: string
                            projectId:
                              type: string
                          required:
                            - id
                            - title
                            - status
                            - issueType
                            - projectId
                          additionalProperties: false
                      required:
                        - seq
                        - eventType
                        - actorType
                        - actorId
                        - oldValue
                        - newValue
                        - createdAt
                        - issue
                      additionalProperties: false
                  cursor:
                    type: number
                  hasMore:
                    type: boolean
                required:
