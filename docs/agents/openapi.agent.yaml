openapi: 3.1.0
info:
  title: Sentinel Agent API
  version: 1.0.0
  description: GENERATED -- do not hand-edit. Source of truth is apps/dashboard-web/src/lib/server/agent-api-spec/ (schemas.ts + registry.ts); regenerate with `pnpm openapi:agent` after any change there. docs/agents/SENTINEL_AGENT_GUIDE.md remains the prose-authoritative reference; this file is a machine-readable schema kept in lockstep with the route handlers under apps/dashboard-web/src/routes/api/agent/** by openapi-drift.test.ts and completeness.test.ts.
servers:
  - url: https://{host}
    variables:
      host:
        default: sentinel.example.com
security:
  - agentKey: []
components:
  securitySchemes:
    agentKey:
      type: http
      scheme: bearer
      bearerFormat: sent_agent_<64 lowercase hex chars>
      description: Org-scoped agent key. project_api_keys.scope='agent', linked to one agent, one organization. organizationId is always derived from this credential server-side, never from any request parameter.
paths:
  /api/agent/issues:
    get:
      operationId: listIssues
      summary: List issues in the calling key's organization
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - any
              - user_report
              - system_error
        - name: claimed
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
              - me
        - name: project
          in: query
          required: false
          schema:
            type: string
        - name: environment
          in: query
          required: false
          schema:
            type: string
        - name: waiting
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: since
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - firstSeen
              - lastSeen
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        projectId:
                          type: string
                        projectName:
                          type: string
                        isInbox:
                          type: boolean
                        issueType:
                          type: string
                        message:
                          type: string
                        errorClass:
                          type: string
                        status:
                          type: string
                        assigneeType:
                          type:
                            - string
                            - "null"
                        assignedTo:
                          type:
                            - string
                            - "null"
                        waitingOn:
                          type:
                            - string
                            - "null"
                        firstSeen:
                          type:
                            - string
                            - "null"
                          format: date-time
                        lastSeen:
                          type:
                            - string
                            - "null"
                          format: date-time
                        count:
                          type: number
                        severity:
                          type:
                            - string
                            - "null"
                        reporterId:
                          type:
                            - string
                            - "null"
                        isWaiting:
                          type: boolean
                        environment:
                          type: string
                        waitingSince:
                          type:
                            - string
                            - "null"
                          format: date-time
                        claimedAt:
                          type:
                            - string
                            - "null"
                          format: date-time
                        affectedUserCount:
                          type: integer
                          minimum: 0
                        affectedTenantCount:
                          type: integer
                          minimum: 0
                      required:
                        - id
                        - projectId
                        - projectName
                        - isInbox
                        - issueType
                        - message
                        - errorClass
                        - status
                        - assigneeType
                        - assignedTo
                        - waitingOn
                        - firstSeen
                        - lastSeen
                        - count
                        - severity
                        - reporterId
                        - isWaiting
                        - environment
                        - waitingSince
                        - claimedAt
                        - affectedUserCount
                        - affectedTenantCount
                      additionalProperties: false
                  nextCursor:
                    type: string
                required:
                  - issues
                additionalProperties: false
        "400":
