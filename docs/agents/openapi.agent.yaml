          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: project
          in: query
          required: false
          schema:
            type: string
        - name: waiting
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: since
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - firstSeen
              - lastSeen
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        projectId:
                          type: string
                        projectName:
                          type: string
                        isInbox:
                          type: boolean
                        issueType:
                          type: string
                        message:
                          type: string
                        errorClass:
                          type: string
                        status:
                          type: string
                        assigneeType:
                          type:
                            - string
                            - "null"
                        assignedTo:
                          type:
                            - string
                            - "null"
                        waitingOn:
                          type:
                            - string
                            - "null"
                        firstSeen:
                          type:
                            - string
                            - "null"
                          format: date-time
                        lastSeen:
                          type:
                            - string
                            - "null"
                          format: date-time
                        count:
                          type: number
                        severity:
                          type:
                            - string
                            - "null"
                        reporterId:
                          type:
                            - string
                            - "null"
                        isWaiting:
                          type: boolean
                        claimedAt:
                          type:
                            - string
                            - "null"
