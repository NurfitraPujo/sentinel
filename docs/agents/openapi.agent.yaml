  /api/agent/batch:
    post:
      operationId: runBatch
      summary: Run up to 20 mutations sequentially in one HTTP round trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operations:
                  type: array
                  items:
                    type: object
                    properties:
                      op:
                        type: string
                        enum:
                          - issues.status
                          - issues.claim
                          - issues.claim.release
                          - issues.comment
                          - comments.edit
                          - comments.delete
                          - issues.report.severity
                          - issues.progress
                          - issues.relations.add
                          - issues.relations.remove
                      issueId:
                        type: string
                      params: {}
                    required:
                      - op
                      - issueId
                    additionalProperties: false
                  minItems: 1
                  maxItems: 20
                stopOnError:
                  type: boolean
              required:
                - operations
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        ok:
                          type: boolean
                        status:
                          type: number
                        result: {}
                        error:
                          type: string
                        skipped:
                          type: boolean
                        claimedBy:
                          type:
                            - string
                            - "null"
                        claimedAt:
                          type:
                            - string
                            - "null"
                      required:
                        - ok
                        - status
                      additionalProperties: false
                  completed:
                    type: number
                required:
                  - results
                  - completed
                additionalProperties: false
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
                additionalProperties: false
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
                additionalProperties: false
